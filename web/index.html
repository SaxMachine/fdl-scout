<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDL Scout · codifiche MINI F5x</title>
<meta name="description" content="Legge gli FWL di E-Sys nel browser e dice quali codifiche della tua MINI F5x sono attive, attivabili o ancora da scoprire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='14' rx='7' fill='%23C8102E'/%3E%3Ccircle cx='22' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="26" height="14" rx="7"/><circle cx="22" cy="16" r="5"/></svg>
    <span class="brand-name" data-t="title">FDL Scout</span>
  </a>
  <span class="brand-tag" data-t="tagline"></span>
  <div class="lang" role="group" aria-label="Lingua / Language">
    <button type="button" data-lang="it" aria-pressed="true">IT</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="hero-text">
      <h1 data-t="heroH"></h1>
      <p data-t="heroP"></p>
    </div>
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="files" multiple accept=".fwl,.txt,.xml,.FWL,.TXT,.XML" hidden>
      <span class="drop-switches" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
      <strong data-t="drop"></strong>
      <span class="drop-or"><span data-t="dropOr"></span> <u data-t="pick"></u></span>
      <small data-t="dropHint"></small>
    </label>
  </section>

  <section class="loaded" id="loaded" hidden>
    <div class="loaded-head">
      <h2 id="loadedTitle"></h2>
      <button type="button" class="ghost" id="addMore" data-t="pick"></button>
      <button type="button" class="ghost" id="reset" data-t="reset"></button>
    </div>
    <ul class="units" id="units"></ul>
  </section>

  <section class="overview" aria-live="polite">
    <div class="meter" id="meter"></div>
    <ul class="legend" id="legend"></ul>
    <p class="catalogue-note" id="catalogueNote" data-t="catalogue"></p>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-codings" aria-controls="panel-codings" aria-selected="true" data-t="tabCodings"></button>
    <button role="tab" id="tab-discover" aria-controls="panel-discover" aria-selected="false"><span data-t="tabDiscover"></span> <span class="tab-count" id="discoverCount"></span></button>
    <button role="tab" id="tab-share" aria-controls="panel-share" aria-selected="false" data-t="tabShare"></button>
  </nav>

  <section role="tabpanel" id="panel-codings" aria-labelledby="tab-codings">
    <div class="filters">
      <select id="fEcu"></select>
      <select id="fState"></select>
      <input type="search" id="fQ">
      <label class="check"><input type="checkbox" id="fHide"> <span data-t="hideAdvised"></span></label>
    </div>
    <ol class="rows" id="rows"></ol>
    <p class="empty" id="empty" data-t="empty" hidden></p>
  </section>

  <section role="tabpanel" id="panel-discover" aria-labelledby="tab-discover" hidden>
    <p class="intro" data-t="discoverIntro"></p>
    <p class="empty" id="discoverEmpty" data-t="discoverEmpty"></p>
    <input type="search" id="dQ" hidden>
    <div id="discover"></div>
  </section>

  <section role="tabpanel" id="panel-share" aria-labelledby="tab-share" hidden>
    <p class="intro" data-t="shareIntro"></p>
    <p class="empty" id="shareEmpty" data-t="shareEmpty"></p>
    <form class="share" id="shareForm" hidden>
      <label><span data-t="chassis"></span><input name="telaio" placeholder="F54"></label>
      <label><span data-t="year"></span><input name="anno" inputmode="numeric" placeholder="2022"></label>
      <label><span data-t="ilevel"></span><input name="i_level" placeholder="F056-26-03-519"></label>
      <label><span data-t="hu"></span><input name="hu" placeholder="NBT EVO ID6"></label>
      <label class="wide"><span data-t="note"></span><input name="note"></label>
      <p class="removed" id="removed"></p>
      <div class="share-actions">
        <button type="submit" class="primary" data-t="downloadFp"></button>
        <a class="ghost" id="issueLink" target="_blank" rel="noopener" data-t="openIssue"></a>
      </div>
    </form>
  </section>
</main>

<div class="dock" id="dock" hidden>
  <button type="button" class="primary" id="openList"></button>
</div>

<dialog id="listDialog">
  <form method="dialog">
    <h2 data-t="listTitle"></h2>
    <p data-t="listIntro"></p>
    <pre id="listText"></pre>
    <div class="dialog-actions">
      <button type="button" class="primary" id="copyList" data-t="copy"></button>
      <button type="button" class="ghost" id="downloadList" data-t="download"></button>
      <button class="ghost" data-t="close"></button>
    </div>
  </form>
</dialog>

<footer class="foot">
  <p data-t="footer"></p>
  <p><a id="repoLink" target="_blank" rel="noopener" data-t="source"></a> · <span id="dbDate"></span></p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
