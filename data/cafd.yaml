# Riconoscimento delle centraline.
#
# Gli FWL esportati da E-Sys si chiamano CAFD_<id>_<versione>.fwl e non contengono il nome
# della centralina. Il parser prova, in ordine:
#   1. il nome della centralina nel nome del file o nell'intestazione (es. "HU_NBT2", "BDC_BODY");
#   2. l'identificativo CAFD (8 cifre esadecimali) cercato in `cafd`;
#   3. le `firme`: parametri che compaiono solo in quella centralina.
# Se nessuno funziona, l'utente sceglie la centralina a mano nella pagina.
#
# Una centralina può avere più CAFD (ACSM ne ha tre, FZD due).
# Gli identificativi vengono da FWL reali (MINI F54 03/2022, i-level F056-26-03-519).
# Altre auto, BMW comprese, hanno CAFD diversi per la stessa centralina: aggiungili qui
# solo quando li leggi da un FWL reale o da una fonte che li documenta. NBT (senza EVO) e HU_NBT2 (NBT EVO) sono
# head unit diverse: non unirle con un alias.

cafd:
  "000000B5": SMFA        # memoria sedile guida
  "00000D37": ZBE         # controller iDrive
  "00000F9B": ASD
  "00001148": KAFAS
  "000011AB": ACSM        # codifica airbag e cinture
  "000011AC": ACSM        # calibrazione algoritmo crash
  "000011AD": ACSM        # parametri sensori
  "00001412": FZD         # allarme (DWA) e protezione abitacolo
  "00001413": FZD         # tetto panorama
  "000016EE": IHKA
  "000017BE": BDC_BODY
  "00001D75": TRSVC       # retrocamera (top/rear view camera)
  "00001EF6": HU_NBT2
  "00001F61": ATM
  "000024C3": FLE         # fari LED, in E-Sys FLE [43] e FLE [44] (sinistro e destro, stesso CAFD)
  "00002742": DME
  "0000297A": DSC
  "000031C9": EGS         # cambio automatico, in E-Sys "EGS5"
  "00005B2B": KOMBI
  # Da qui in giù: CAFD documentati nei cheat sheet di E-Sys Launcher raccolti in
  # https://github.com/packetpilot/bmw-f (attributi cafd id, name e series). Il nome è
  # quello di E-Sys; tra parentesi i telai indicati dalla fonte.
  "0000141F": KOMBI       # (F55, F56, F57, F45)
  "00001AB7": PMA         # PMA_PDC (F55, F56, F57, F45)
  "00000794": FEM_BODY    # (F20, F30)
  "000007A1": REM         # modulo elettronico posteriore (F30)
  "00000760": KOMBI       # L7_BASIS (F20-F36)
  "000009C8": KOMBI       # L7_MID (F15, F20, F30)
  "00000069": KOMBI       # (F01, F10)
  "00001060": KOMBI       # FPK / 6WB (F01, F10)
  "00000DED": HU_NBT      # NBT senza EVO (F01, F10)
  "000000F9": HU_CIC      # (F01, F10)
  "0000012F": FRM         # modulo luci e specchi (F01, F10)
  "0000106D": FRM         # (F01, F10)
  "0000000F": CAS         # Car Access System (F01, F10)
  "00000092": IHKA        # (F01, F10)
  "00000A3F": IHKA        # (F10, F20, F30)
  "000006DE": IHKA        # (F15, F25, F48)
  "000047D6": IHKA        # (F15, F25, F48)
  "0000009C": ACSM        # (F01, F10)
  "00000909": ACSM        # (F01, F10)
  "00000911": ACSM        # (F20-F36)
  "00000223": TRSVC       # (F01, F10, F30, F80)
  "0000023F": EGS         # (F01, F10)
  "00000552": FZD         # (F01, F10)
  "00000A07": FZD         # (F20, F30)
  "00000122": KAFAS
  "000019CC": DSC         # (F20-F36)
  "00001A33": DSC         # (F30, F80)
  "000000D8": DSC         # (F01)
  "00000C18": DSC         # (F01, F10)
  "0000146B": PMA         # PMA_PDC (F15)
  "0000067B": ICM         # (F01, F10)
  "00000052": ICM         # (F01)
  "000013D8": ICM         # (F15)
  "000010BA": LHM         # modulo luci (F15, F20, F30)
  "000016BF": LHM         # (F15, F20, F30)
  "00001082": TMS         # driver fari (F10, F20, F30)
  "00001083": TMS         # (F10, F20, F30)

alias:
  BDC: BDC_BODY
  NBTEVO: HU_NBT2
  HU_NBTEVO: HU_NBT2
  IHKA2: IHKA
  PDC: PMA
  RFK: TRSVC
  FLER: FLE
  FLEL: FLE
  EGS5: EGS

# Altri nomi di centralina proposti quando si sceglie a mano (BMW serie F senza voci
# nel database). Si può sempre scrivere il nome esatto che mostra E-Sys.
altre: [FEM_BODY, HU_NBT, HU_CIC]

firme:
  HU_NBT2: [HMI_ID_VERSION, API_USB_VIDEO, CLIMATE_AUTORECIRCULATION]
  KOMBI: [BR_KENNUNG, HUD_FAHRSTUFE_ENABLE, BC_LEERZEILE]
  BDC_BODY: [TFL_MODUS, ASP_BEIKLAPPEN, WL_TIMEOUT, FesInitMode]
  IHKA: [MEMORY_UMLUFT, RESTWAERME, KLIMA_SG_ART]
  KAFAS: [DISPLAY_HEADWAY_DISTANCE, FCW_ON_OFF, TLC_ON_OFF]
  SMFA: [Kunden_Memory, SA_Konfig_SHZ, Verstell_Schalter_Typ]
  ZBE: [Beschleunigerschwelle_1, Rastabstand, Default_app]
  ASD: [Competition Paket, Power Class, Audio Level]
  ACSM: [ZUENDKREIS_0, Gurtzustandsanzeige_Fahrer, FGS_SAT_Hersteller, ALGO_Checksumme]
  FZD: [DWA verbaut, Innenraumschutz, ascCOD_Factory, ascCOD_PanicAllowed]
  TRSVC: [PMA Availability, RV Brightness Default, Coded Vehicle Type]
  ATM: [ECALL_SPEAKER_VOL_DEF, NGTP_KEYTABLE, TELEMATIC_DISABLE]
  FLE: [LWR_ABSENK_OFFSET, AHL_ENABLE, LED_SUPPLY_MIN_ON_V]
  DME: [MSA_Startervariante, IntvlFrcInitial1, fEPM_Basisbordnetz_Batterietyp]
  DSC: [C_SLD_vmax_kmh, C_Funktion_HillDecentControl_aktiv_e, QdmAllradTyp]
  EGS: [Sport T/M, LA_MAB, AGS_US]

