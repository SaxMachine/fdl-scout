# Riconoscimento delle centraline.
#
# Gli FWL esportati da E-Sys si chiamano CAFD_<id>_<versione>.fwl e non contengono il nome
# della centralina. Il parser prova, in ordine:
#   1. il nome della centralina nel nome del file o nell'intestazione (es. "HU_NBT2", "BDC_BODY");
#   2. l'identificativo CAFD (8 cifre esadecimali) cercato in `cafd`;
#   3. le `firme`: parametri che compaiono solo in quella centralina.
# Se nessuno funziona, l'utente sceglie la centralina a mano nella pagina.
#
# Una centralina può avere più CAFD (ACSM ne ha tre, FZD due).
# Gli identificativi vengono da FWL reali (F54 03/2022, i-level F056-26-03-519).
# Altre auto possono avere CAFD diversi per la stessa centralina: aggiungili qui.

cafd:
  "000000B5": SMFA        # memoria sedile guida
  "00000D37": ZBE         # controller iDrive
  "00000F9B": ASD
  "00001148": KAFAS
  "000011AB": ACSM        # codifica airbag e cinture
  "000011AC": ACSM        # calibrazione algoritmo crash
  "000011AD": ACSM        # parametri sensori
  "00001412": FZD         # allarme (DWA) e protezione abitacolo
  "00001413": FZD         # tetto panorama
  "000016EE": IHKA
  "000017BE": BDC_BODY
  "00001D75": TRSVC       # retrocamera (top/rear view camera)
  "00001EF6": HU_NBT2
  "00001F61": ATM
  "000024C3": FLE         # fari LED, in E-Sys FLE [43] e FLE [44] (sinistro e destro, stesso CAFD)
  "00002742": DME
  "0000297A": DSC
  "000031C9": EGS         # cambio automatico, in E-Sys "EGS5"
  "00005B2B": KOMBI

alias:
  BDC: BDC_BODY
  HU_NBT: HU_NBT2
  NBT: HU_NBT2
  NBTEVO: HU_NBT2
  HU_NBTEVO: HU_NBT2
  IHKA2: IHKA
  PDC: PMA
  RFK: TRSVC
  FLER: FLE
  FLEL: FLE
  EGS5: EGS

firme:
  HU_NBT2: [HMI_ID_VERSION, API_USB_VIDEO, CLIMATE_AUTORECIRCULATION]
  KOMBI: [BR_KENNUNG, HUD_FAHRSTUFE_ENABLE, BC_LEERZEILE]
  BDC_BODY: [TFL_MODUS, ASP_BEIKLAPPEN, WL_TIMEOUT, FesInitMode]
  IHKA: [MEMORY_UMLUFT, RESTWAERME, KLIMA_SG_ART]
  KAFAS: [DISPLAY_HEADWAY_DISTANCE, FCW_ON_OFF, TLC_ON_OFF]
  SMFA: [Kunden_Memory, SA_Konfig_SHZ, Verstell_Schalter_Typ]
  ZBE: [Beschleunigerschwelle_1, Rastabstand, Default_app]
  ASD: [Competition Paket, Power Class, Audio Level]
  ACSM: [ZUENDKREIS_0, Gurtzustandsanzeige_Fahrer, FGS_SAT_Hersteller, ALGO_Checksumme]
  FZD: [DWA verbaut, Innenraumschutz, ascCOD_Factory, ascCOD_PanicAllowed]
  TRSVC: [PMA Availability, RV Brightness Default, Coded Vehicle Type]
  ATM: [ECALL_SPEAKER_VOL_DEF, NGTP_KEYTABLE, TELEMATIC_DISABLE]
  FLE: [LWR_ABSENK_OFFSET, AHL_ENABLE, LED_SUPPLY_MIN_ON_V]
  DME: [MSA_Startervariante, IntvlFrcInitial1, fEPM_Basisbordnetz_Batterietyp]
  DSC: [C_SLD_vmax_kmh, C_Funktion_HillDecentControl_aktiv_e, QdmAllradTyp]
  EGS: [Sport T/M, LA_MAB, AGS_US]

nomi:
  HU_NBT2: { it: "Head unit NBT EVO", en: "NBT EVO head unit" }
  BDC_BODY: { it: "Body Domain Controller (carrozzeria)", en: "Body Domain Controller" }
  KOMBI: { it: "Quadro strumenti e HUD", en: "Instrument cluster and HUD" }
  KAFAS: { it: "Telecamera assistenza alla guida", en: "Driver assistance camera" }
  DME: { it: "Centralina motore", en: "Engine control unit" }
  IHKA: { it: "Climatizzatore", en: "Climate control" }
  PMA: { it: "Sensori di parcheggio e parcheggio automatico", en: "Parking sensors and park assistant" }
  TRSVC: { it: "Retrocamera", en: "Rear view camera" }
  ATM: { it: "Telematica", en: "Telematics" }
  ASD: { it: "Active Sound Design", en: "Active Sound Design" }
  FZD: { it: "Centralina tetto (allarme, tetto panorama)", en: "Roof function centre (alarm, sunroof)" }
  SAS: { it: "Assistenza alla guida (ACC)", en: "Driver assistance (ACC)" }
  DSC: { it: "Controllo stabilità", en: "Stability control" }
  ACSM: { it: "Airbag e cinture", en: "Airbags and seat belts" }
  SMFA: { it: "Sedile guida (memoria, riscaldamento)", en: "Driver seat module" }
  ZBE: { it: "Controller iDrive", en: "iDrive controller" }
