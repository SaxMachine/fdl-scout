# Codifiche note per la centralina ASD (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: asd.profilo-suono-motore
  centralina: ASD
  titolo:
    it: Profilo del suono motore (ASD)
    en: Engine sound profile (ASD)
  descrizione:
    it: 'Cambia il suono del motore che l''Active Sound Design riproduce dagli altoparlanti in abitacolo, scegliendo quello di un altro motore.'
    en: 'Changes the engine sound that Active Sound Design plays through the cabin speakers, picking the one of another engine.'
  parametri:
  - nome: Engine
    regolabile: true
  valori_suggeriti:
    it: Codice motore dalla lista E-Sys (in una fonte S63B44)
    en: Engine code from the E-Sys list (S63B44 in one source)
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Il valore è un codice motore e deve esistere nella lista del tuo CAFD. L''unica fonte usa S63B44 (il V8 delle M) partendo da N26B20. Non cambia il suono allo scarico, solo quello riprodotto in abitacolo.'
    en: 'The value is an engine code and must exist in your CAFD''s list. The only source uses S63B44 (the M V8) starting from N26B20. It does not change the exhaust sound, only what is played in the cabin.'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/03-Features/Sport-Features.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: Engine=B48A20
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: B48A20
    esito: Parametro presente, non provato
