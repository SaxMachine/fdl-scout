- id: bdc_body.luci-posteriori-con-le-diurne
  centralina: BDC_BODY
  titolo:
    it: Luci posteriori accese insieme alle luci diurne
    en: Rear lights on together with the daytime running lights
  descrizione:
    it: 'Con le luci diurne accese si accendono anche le luci posteriori.'
    en: 'With daytime running lights on, the tail lights come on too.'
  parametri:
  - nome: MAPPING_TAGFAHRL_1_H_L_OUTPUT
    target: sl_l
  - nome: MAPPING_TAGFAHRL_1_H_R_OUTPUT
    target: sl_r
  rischio: medio
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Confermata da più utenti F5x sul forum tedesco. Le luci diurne devono essere attive nel menu iDrive. Sulle auto con due coppie di luci posteriori vedi anche la voce della seconda coppia. Verifica la conformità alle norme del tuo paese.'
    en: 'Confirmed by several F5x owners on the German forum. Daytime running lights must be on in the iDrive menu. On cars with two pairs of tail lights see also the second pair entry. Check compliance with your country''s rules.'
