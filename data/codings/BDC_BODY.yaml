  titolo:
    it: 'Ritardo di sblocco del baule (senza Smart Opener)'
    en: 'Boot unlock delay (without Smart Opener)'
  parametri:
  - nome: VAM_TIME_DELAY_BOOTLID
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale; una fonte indica wert_01 = 0,1 s (di fabbrica 0,3 s), un''altra 00 = nessun ritardo.'
    en: 'Hexadecimal; one source gives wert_01 = 0.1 s (factory 0.3 s), another 00 = no delay.'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  note:
    it: 'Ritardo con cui il baule si sblocca, senza Smart Opener (una fonte: di fabbrica 0,3 s). Il tempo per cui va tenuto premuto il tasto del baule sul telecomando è un altro parametro, RC_TIME_DELAY_BOOTLID. Sulle BMW con FEM il parametro si chiama CLM_TIME_DELAY_BOOTLID; nella BDC della F54 di riferimento esiste VAM_TIME_DELAY_BOOTLID, con il prefisso VAM_ al posto di CLM_ come per altri parametri delle chiusure. La corrispondenza è dedotta dal nome: da verificare.'
    en: 'Delay with which the boot unlocks, without Smart Opener (one source: factory 0.3 s). How long the boot button on the remote must be held is a different parameter, RC_TIME_DELAY_BOOTLID. On BMWs with a FEM the parameter is called CLM_TIME_DELAY_BOOTLID; the reference F54 BDC has VAM_TIME_DELAY_BOOTLID, with the VAM_ prefix instead of CLM_ as for other locking parameters. The match is inferred from the name: to be verified.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: VAM_TIME_DELAY_BOOTLID=wert_01
    esito: Da verificare
- id: bdc_body.tempo-richiusura-automatica
  centralina: BDC_BODY
  titolo:
    it: 'Tempo prima della richiusura automatica'
    en: 'Time before automatic relocking'
  parametri:
  - nome: VAM_TIME_PIA_LOCK_AT_TIMEOUT
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale in unità di 10 s: 03 = 30 s, 0C = 120 s (di fabbrica secondo le fonti BMW).'
    en: 'Hexadecimal in 10 s units: 03 = 30 s, 0C = 120 s (factory per BMW sources).'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Se apri l''auto e non apri nessuna porta, dopo questo tempo si richiude da sola; serve la richiusura automatica attiva (CLI_DEFAULT_LOCK_AT_TIMEOUT). Sulle BMW con FEM il parametro si chiama CLM_TIME_PIA_LOCK_AT_TIMEOUT; nella BDC della F54 di riferimento esiste VAM_TIME_PIA_LOCK_AT_TIMEOUT, con il prefisso VAM_ al posto di CLM_ come per altri parametri delle chiusure. La corrispondenza è dedotta dal nome: da verificare.'
    en: 'If you unlock the car and open no door, it relocks after this time; automatic relocking must be on (CLI_DEFAULT_LOCK_AT_TIMEOUT). On BMWs with a FEM the parameter is called CLM_TIME_PIA_LOCK_AT_TIMEOUT; the reference F54 BDC has VAM_TIME_PIA_LOCK_AT_TIMEOUT, with the VAM_ prefix instead of CLM_ as for other locking parameters. The match is inferred from the name: to be verified.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Windows-Doors.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: VAM_TIME_PIA_LOCK_AT_TIMEOUT=01
    esito: Da verificare
