# Codifiche note per la centralina BDC_BODY (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: bdc_body.memoria-start-stop-ultimo-stato
  centralina: BDC_BODY
  titolo:
    it: Memoria Start/Stop (ultimo stato)
    en: Start/Stop memory (last state)
  parametri:
  - nome: TCM_MSA_MEMORY
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Già attivo nel BDC. Nella DME risulta Wert_00, ma la funzione la gestisce il BDC.
    en: Already active in the BDC. The DME shows Wert_00, but the function is handled by the BDC.
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Start-Stop.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv
    esito: Già attivo
