- id: bdc_body.angolo-dello-specchio-passeggero-in-retromarcia
  centralina: BDC_BODY
  titolo:
    it: Angolo dello specchio passeggero in retromarcia
    en: Passenger mirror angle in reverse
  parametri:
  - nome: ASP_BORDSTEINAUTOMATIK_DELTA
    target: '32'
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Su F54 documentato da 55 a 32: lo specchio si abbassa meno. Valore a gusto, ritocca finché vedi bene il
      marciapiede.'
    en: 'Documented on an F54 from 55 to 32: the mirror tilts down less. Adjust to taste until you can see the kerb.'
  fonti:
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3515937/note.aspx
  - https://minkara.carview.co.jp/userid/125014/car/2087329/5550627/note.aspx
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 85_Digits (55)
    esito: Consigliato
- id: bdc_body.memoria-della-modalita-di-guida
  centralina: BDC_BODY
  titolo:
    it: Memoria della modalità di guida
    en: Driving mode memory
  parametri:
  - nome: FesAllowMode4LastFunction
    target: aktiv
  - nome: FesAllowMode7LastFunction
    target: aktiv
  - nome: FesLastFunctionInterval
    regolabile: true
  valori_suggeriti:
    it: aktiv
    en: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Più utenti F5x la attivano. Abilita il ricordo solo per le modalità presenti nel tuo BDC (parametri FesHasModeN):
      sulla F54 di riferimento sono 3, 4 e 7, abilita il ricordo per quelle che vuoi mantenere al riavvio.'
    en: 'Several F5x owners enable it. Enable memory only for the modes present in your BDC (FesHasModeN parameters):
      on the reference F54 these are 3, 4 and 7. Enable it for the ones you want kept after a restart.'
  fonti:
  - https://github.com/butterflywaltz/BMW_Coding/blob/main/FDL%20Codes/BDC_FDL_Final.txt
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: bdc_body.idrive-e-radio-spenti-all-apertura-della-porta
