- id: bdc_body.ritardo-apertura-portellone-piede
  centralina: BDC_BODY
  titolo:
    it: 'Ritardo di apertura del portellone col piede (Comfort Access)'
    en: 'Kick-to-open tailgate delay (Comfort Access)'
  descrizione:
    it: 'Riduce o toglie l''attesa tra il movimento del piede sotto il paraurti e lo sblocco del portellone.'
    en: 'Shortens or removes the wait between the foot movement under the bumper and the tailgate unlocking.'
  parametri:
  - nome: VAM_TIMEOUT_HK_SMO
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale a passi di 0,1 s. Su una F54 vale 0C (1,2 s); le fonti BMW usano 01-03 (0,1-0,3 s).'
    en: 'Hex in 0.1 s steps. On an F54 it reads 0C (1.2 s); BMW sources use 01-03 (0.1-0.3 s).'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  - F60
  note:
    it: 'Solo con Comfort Access e Smart Opener. Sulle BMW con FEM il parametro si chiama CLM_TIMEOUT_HK_SMO ed è in quattro cheat sheet; sul BDC MINI esiste con il prefisso VAM_, come succede per altri parametri delle chiusure. La corrispondenza è dedotta dal nome: da verificare.'
    en: 'Only with Comfort Access and Smart Opener. On BMWs with a FEM the parameter is called CLM_TIMEOUT_HK_SMO and is in four cheat sheets; on the MINI BDC it exists with the VAM_ prefix, as for other locking parameters. The match is inferred from the name: to be verified.'
  fonti:
  - https://www.northamericanmotoring.com/forums/2nd-gen-countryman-f60-talk-2016-2024/317869-e-sys-coding-on-f60.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Windows-Doors.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: VAM_TIMEOUT_HK_SMO=0C
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: Wert_00
    esito: Parametro presente, non provato
- id: bdc_body.ritardo-apertura-baule-tasto
  centralina: BDC_BODY
  titolo:
    it: 'Ritardo di sblocco del baule (senza Smart Opener)'
    en: 'Boot unlock delay (without Smart Opener)'
  descrizione:
    it: 'Riduce o toglie il ritardo con cui il baule si sblocca dal tasto, senza Smart Opener.'
    en: 'Shortens or removes the delay before the boot unlocks from the button, without Smart Opener.'
  parametri:
  - nome: VAM_TIME_DELAY_BOOTLID
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale; una fonte indica wert_01 = 0,1 s (di fabbrica 0,3 s), un''altra 00 = nessun ritardo.'
    en: 'Hexadecimal; one source gives wert_01 = 0.1 s (factory 0.3 s), another 00 = no delay.'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Una fonte indica 0,3 s di fabbrica. Il tempo per cui va tenuto premuto il tasto del baule sul telecomando è un altro parametro (RC_TIME_DELAY_BOOTLID). Sulle BMW con FEM si chiama CLM_TIME_DELAY_BOOTLID; sul BDC MINI c''è con il prefisso VAM_. La corrispondenza è dedotta dal nome: da verificare.'
    en: 'One source gives 0.3 s from the factory. How long the boot button on the key must be held is another parameter (RC_TIME_DELAY_BOOTLID). On BMWs with a FEM it is called CLM_TIME_DELAY_BOOTLID; on the MINI BDC it has the VAM_ prefix. The match is inferred from the name: to be verified.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: VAM_TIME_DELAY_BOOTLID=wert_01
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: wert_01
    esito: Parametro presente, non provato
- id: bdc_body.tempo-richiusura-automatica
  centralina: BDC_BODY
  titolo:
    it: 'Tempo prima della richiusura automatica'
    en: 'Time before automatic relocking'
  descrizione:
    it: 'Se apri l''auto con la chiave e non apri nessuna porta, si richiude da sola dopo questo tempo.'
    en: 'If you unlock the car with the key and open no door, it locks itself again after this time.'
  parametri:
  - nome: VAM_TIME_PIA_LOCK_AT_TIMEOUT
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale in unità di 10 s: 03 = 30 s, 0C = 120 s (di fabbrica secondo le fonti BMW).'
    en: 'Hexadecimal in 10 s units: 03 = 30 s, 0C = 120 s (factory per BMW sources).'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Serve la richiusura automatica attiva (CLI_DEFAULT_LOCK_AT_TIMEOUT). Sulle BMW con FEM il parametro si chiama CLM_TIME_PIA_LOCK_AT_TIMEOUT; sul BDC MINI c''è con il prefisso VAM_. La corrispondenza è dedotta dal nome: da verificare.'
    en: 'Needs automatic relocking on (CLI_DEFAULT_LOCK_AT_TIMEOUT). On BMWs with a FEM the parameter is called CLM_TIME_PIA_LOCK_AT_TIMEOUT; on the MINI BDC it has the VAM_ prefix. The match is inferred from the name: to be verified.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Windows-Doors.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: VAM_TIME_PIA_LOCK_AT_TIMEOUT=01
    esito: Da verificare
