- id: bdc_body.luci-incluse-nel-benvenuto
  centralina: BDC_BODY
  titolo:
    it: Luci incluse nel benvenuto
    en: Lights included in the welcome light
  parametri:
  - nome: MAPPING_ABBLENDL_L_PART_OF
    regolabile: true
  - nome: MAPPING_ABBLENDL_R_PART_OF
    regolabile: true
  - nome: MAPPING_NEBELSCHW_L_PART_OF
    regolabile: true
  - nome: MAPPING_NEBELSCHW_R_PART_OF
    regolabile: true
  - nome: MAPPING_TAGFAHRL_1_V_L_PART_OF
    regolabile: true
  - nome: MAPPING_TAGFAHRL_1_V_R_PART_OF
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Su questo BDC i parametri si chiamano MAPPING_<luce>_PART_OF (non _PART_OF_WL come su altre F5x). Nella
      F54 di riferimento luci di posizione, targa e luci design sono già nel benvenuto (WLH_FMH_RL), gli anabbaglianti
      solo nel follow-me-home (FMH_RL), fendinebbia e DRL anteriori no (off). Cambia una coppia sinistra/destra
      alla volta.
    en: On this BDC the parameters are called MAPPING_<light>_PART_OF (not _PART_OF_WL as on other F5x). On the
      reference F54 parking lights, number plate and design lights are already part of the welcome light (WLH_FMH_RL),
      low beams only of follow-me-home (FMH_RL), fog lights and front DRL are not (off). Change one left/right pair
      at a time.
  fonti:
  - https://bimmercode.app/vehicles/f56
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: FMH_RL / off / off
    esito: Da verificare
  valori_suggeriti:
    it: 'Il valore dice di quali funzioni fa parte la luce: WLH è la luce di benvenuto, FMH il follow-me-home. Per
      aggiungere una luce al benvenuto scegli dalla lista E-Sys la combinazione che include WLH (es. FMH_RL → WLH_FMH_RL).'
    en: 'The value says which functions the light belongs to: WLH is the welcome light, FMH is follow-me-home. To
      add a light to the welcome light, pick from the E-Sys list the combination that includes WLH (e.g. FMH_RL
      → WLH_FMH_RL).'
