- id: bdc_body.chiusura-comfort-del-tetto-con-la-chiave
  centralina: BDC_BODY
  titolo:
    it: 'Chiusura comfort: finestrini, tetto e specchi tenendo premuto il tasto'
    en: 'Comfort closing: windows, roof and mirrors by holding the button'
  parametri:
  - nome: KOMFORTSCHLIESSUNG
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Interruttore generale della chiusura comfort: tenendo premuto il tasto di chiusura si chiudono finestrini e tetto (SA 402) e si ripiegano gli specchi. Le varianti dal telecomando e dal Comfort Access hanno voci a parte.'
    en: 'Master switch of comfort closing: holding the lock button closes the windows and roof (SA 402) and folds the mirrors. The remote and Comfort Access variants have their own entries.'
