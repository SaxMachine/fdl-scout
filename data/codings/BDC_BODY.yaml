# Codifiche note per la centralina BDC_BODY (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: bdc_body.memoria-start-stop-ultimo-stato
  centralina: BDC_BODY
  titolo:
    it: Memoria Start/Stop (ultimo stato)
    en: Start/Stop memory (last state)
  descrizione:
    it: 'Lo Start/Stop resta come l''hai lasciato - se lo spegni, alla ripartenza è ancora spento.'
    en: 'Start/Stop stays as you left it - if you turn it off, it is still off when you set off again.'
  parametri:
  - nome: TCM_MSA_MEMORY
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Codificata e provata su F54. Basta il BDC: nella DME il parametro gemello resta Wert_00.'
    en: 'Coded and tested on F54. The BDC is enough: in the DME the twin parameter stays Wert_00.'
  fonti:
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5658504/note.aspx
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-12.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Start-Stop.md
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=24
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv
    esito: 'Codificata e provata: ricorda l''ultimo stato'
- id: bdc_body.specchio-passeggero-inclinato-in-retromarcia
  centralina: BDC_BODY
  titolo:
    it: Specchio passeggero inclinato in retromarcia
    en: Passenger mirror tilts down in reverse
  descrizione:
    it: 'In retromarcia lo specchio del passeggero si abbassa per farti vedere il marciapiede.'
    en: 'In reverse the passenger mirror tilts down so you can see the kerb.'
  parametri:
  - nome: ASP_BORDSTEINAUTOMATIK
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Serve la memoria degli specchi (ASP_MEMORY_VERBAUT). L''angolo si regola con la voce "Angolo dello specchio passeggero in retromarcia".'
    en: 'Needs mirror memory (ASP_MEMORY_VERBAUT). The angle is set with the entry "Passenger mirror angle in reverse".'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-6.html
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv
    esito: Già attivo
- id: bdc_body.ribaltamento-specchietti-alla-chiusura
  centralina: BDC_BODY
  titolo:
    it: Ribaltamento specchietti alla chiusura
    en: Fold mirrors when locking
  descrizione:
    it: 'Gli specchietti si ripiegano quando chiudi l''auto con la chiave o con il Comfort Access, e si riaprono quando riparti.'
    en: 'The mirrors fold when you lock the car with the key or Comfort Access, and unfold when you drive off.'
  parametri:
  - nome: ASP_BEIKLAPPEN
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Servono gli specchi ripiegabili elettricamente. La velocità di riapertura è in una voce a parte.'
    en: 'Needs electrically folding mirrors. The unfolding speed is in a separate entry.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-2.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://f48.bimmerpost.com/forums/showthread/1222484/bmw-e-sys-coding-for-the-f48-x1/page/11
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv
    esito: Già attivo
  requisiti_sa:
  - '313'
- id: bdc_body.angolo-dello-specchio-passeggero-in-retromarcia
  centralina: BDC_BODY
  titolo:
    it: Angolo dello specchio passeggero in retromarcia
    en: Passenger mirror angle in reverse
  descrizione:
    it: 'Cambia di quanto si abbassa lo specchio del passeggero in retromarcia.'
    en: 'Changes how far the passenger mirror tilts down in reverse.'
  parametri:
  - nome: ASP_BORDSTEINAUTOMATIK_DELTA
    target: '32'
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Valore esadecimale: più alto, più si abbassa. Le fonti BMW usano 46 o 5A per abbassarlo di più; su una F54 è stato portato da 55 a 32 per abbassarlo di meno. Ritocca finché vedi bene il marciapiede.'
    en: 'Hex value: higher means further down. BMW sources use 46 or 5A to lower it more; on an F54 it was changed from 55 to 32 to lower it less. Adjust until you see the kerb well.'
  fonti:
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5953565/note.aspx
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-6.html
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3515937/note.aspx
  - https://minkara.carview.co.jp/userid/125014/car/2087329/5550627/note.aspx
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 85_Digits (55)
    esito: Consigliato
- id: bdc_body.memoria-della-modalita-di-guida
  centralina: BDC_BODY
  titolo:
    it: Memoria della modalità di guida
    en: Driving mode memory
  descrizione:
    it: 'Alla ripartenza l''auto resta nella modalità di guida che avevi scelto (Sport o Green) invece di tornare a quella normale.'
    en: 'When you restart, the car stays in the driving mode you chose (Sport or Green) instead of going back to the normal one.'
  parametri:
  - nome: FesAllowMode4LastFunction
    target: aktiv
  - nome: FesAllowMode7LastFunction
    target: aktiv
  - nome: FesLastFunctionInterval
    regolabile: true
  valori_suggeriti:
    it: aktiv
    en: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Si abilita una modalità alla volta: FesAllowModeNLastFunction vale per la modalità N, e solo per quelle presenti nel BDC (FesHasModeN). Sulle MINI lette sono 3, 4 e 7. FesLastFunctionInterval decide per quanto tempo viene ricordata (FF = sempre). Più utenti F5x la usano.'
    en: 'You enable one mode at a time: FesAllowModeNLastFunction applies to mode N, and only for modes present in the BDC (FesHasModeN). On the MINIs read they are 3, 4 and 7. FesLastFunctionInterval decides how long it is remembered (FF = always). Several F5x owners use it.'
  fonti:
  - https://github.com/butterflywaltz/BMW_Coding/blob/main/FDL%20Codes/BDC_FDL_Final.txt
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: bdc_body.idrive-e-radio-spenti-all-apertura-della-porta
  centralina: BDC_BODY
  titolo:
    it: 'Logica del morsetto 15 all''apertura della porta (effetto da verificare)'
    en: 'Terminal 15 logic when the door is opened (effect to be verified)'
  descrizione:
    it: 'Nessuna fonte descrive questo parametro. Dal nome spegne il morsetto 15 (l''alimentazione da quadro acceso) quando apri la porta; l''effetto va provato.'
    en: 'No source describes this parameter. From its name it switches off terminal 15 (ignition power) when you open the door; the effect needs testing.'
  parametri:
  - nome: TCM_LOGIC_15_OFF_DOOR
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Fa parte del gruppo TCM_LOGIC_15_OFF_*, che spegne il morsetto 15 in diverse situazioni (cintura, chiusura, presa OBD…). Lo spegnimento di radio e navigazione aprendo la porta è un altro parametro, TCM_LOGIC_R_OFF_DOOR. Sulla JCW F56 letta risulta attivo.'
    en: 'It belongs to the TCM_LOGIC_15_OFF_* group, which switches terminal 15 off in several situations (seat belt, locking, OBD socket…). Switching off radio and navigation when opening the door is another parameter, TCM_LOGIC_R_OFF_DOOR. It is on in the JCW F56 read.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: aktiv
    esito: Già attivo
- id: bdc_body.comportamento-drl-con-luci-di-posizione
  centralina: BDC_BODY
  titolo:
    it: Comportamento DRL con luci di posizione
    en: DRL behaviour with parking lights
  descrizione:
    it: 'Decide come si comportano le luci diurne quando accendi le luci di posizione.'
    en: 'Decides how daytime running lights behave when you turn on the side lights.'
  parametri:
  - nome: TFL_MODUS
    target: tfl_s
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Su una MINI con il valore 02 l''anello si spegne quando accendi le luci di posizione, con 05 resta sempre acceso. Le fonti BMW indicano anche 0 (spente), A (automatiche) e P. Non lega le diurne alla posizione 0 della levetta.'
    en: 'On a MINI with value 02 the ring goes off when you turn on the side lights, with 05 it always stays on. BMW sources also list 0 (off), A (automatic) and P. It does not tie the DRLs to switch position 0.'
  fonti:
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5658504/note.aspx
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3641570/note.aspx
  - https://minkara.carview.co.jp/userid/1685164/blog/37025176
  - https://bmw-mini-r57-60diy.blogspot.com/2017/01/f56-f57_21.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Lighting/Daytime-Running-Lights.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3515937/note.aspx
  - https://minkara.carview.co.jp/userid/208084/car/3468327/7478892/note.aspx
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: tfl_s (02)
    esito: Già attivo
- id: bdc_body.stop-lampeggianti-in-frenata-d-emergenza
  centralina: BDC_BODY
  titolo:
    it: Stop lampeggianti in frenata d'emergenza
    en: Flashing brake lights under emergency braking
  descrizione:
    it: 'In una frenata d''emergenza le luci di stop lampeggiano invece di allargarsi.'
    en: 'In an emergency stop the brake lights flash instead of enlarging.'
  parametri:
  - nome: ESS_AKTIVIERBARER_AUSGANG
    target: bremslicht_blinkend
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Di fabbrica il BDC allarga la superficie illuminata (flaechenvergroesserung); sulle MINI lette è già impostato il lampeggio. Velocità e decelerazione che lo attivano sono in voci a parte.'
    en: 'From the factory the BDC enlarges the lit area (flaechenvergroesserung); the MINIs read are already set to flashing. The speed and deceleration that trigger it are in separate entries.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-5.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: bremslicht_blinkend
    esito: Già attivo
- id: bdc_body.chiusura-comfort-del-tetto-con-la-chiave
  centralina: BDC_BODY
  titolo:
    it: 'Chiusura comfort: finestrini, tetto e specchi tenendo premuto il tasto'
    en: 'Comfort closing: windows, roof and mirrors by holding the button'
  descrizione:
    it: 'Tenendo premuto il tasto di chiusura si chiudono finestrini e tetto e si ripiegano gli specchi; tenendo premuto quello di apertura si aprono.'
    en: 'Holding the lock button closes the windows and roof and folds the mirrors; holding the unlock button opens them.'
  parametri:
  - nome: KOMFORTSCHLIESSUNG
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'È l''interruttore generale della chiusura comfort, dal telecomando e dal Comfort Access. Una fonte precisa che l''apertura parte dopo 2 secondi e la chiusura subito. Il tetto richiede il tetto apribile (SA 402).'
    en: 'It is the main switch for comfort closing, from the key and from Comfort Access. One source notes that opening starts after 2 seconds and closing immediately. The roof needs the sunroof (SA 402).'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Windows-Doors.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv
    esito: Già attivo
  requisiti_sa:
  - '402'
- id: bdc_body.lampeggio-comfort
  centralina: BDC_BODY
  titolo:
    it: Lampeggio comfort
    en: Comfort turn signal
  descrizione:
    it: 'Cambia quante volte lampeggia la freccia con un tocco leggero della levetta.'
    en: 'Changes how many times the indicator flashes with a light touch of the stalk.'
  parametri:
  - nome: PIA_DEFAULT_TIPPBLINKEN
    regolabile: true
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Il numero si può già scegliere dal menu iDrive. Se lo codifichi a mano il valore vale lampeggi meno uno: due fonti indipendenti (NAM e Xcar) riportano che 4 dà 5 lampeggi. Una fonte francese dice che non funziona.'
    en: 'The count can already be chosen in the iDrive menu. If you code it by hand the value is flashes minus one: two independent sources (NAM and Xcar) report that 4 gives 5 flashes. A French source says it does not work.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming.html
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/319265-coding-parameters-that-actually-work-using-bimmercode-expert-mode.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://f48.bimmerpost.com/forums/showthread/1222484/bmw-e-sys-coding-for-the-f48-x1/page/11
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: —
    esito: Già attivo
- id: bdc_body.fendinebbia-come-luci-di-svolta
  centralina: BDC_BODY
  titolo:
    it: Fendinebbia come luci di svolta
    en: Fog lights as cornering lights
  descrizione:
    it: 'In curva e svoltando a bassa velocità si accende il fendinebbia dal lato della svolta, come luce di svolta.'
    en: 'When cornering or turning at low speed the fog light on that side comes on as a cornering light.'
  parametri:
  - nome: MAPPING_ABBIEGEL_L_OUTPUT
    regolabile: true
  - nome: MAPPING_ABBIEGEL_R_OUTPUT
    regolabile: true
  - nome: C_CLC_ENA
    target: '01'
  - nome: KL_ENABLE_LI
    target: KL_Ein
  - nome: KL_ENABLE_RE
    target: KL_Ein
  valori_suggeriti:
    it: 'Uscite: nsw_l/nsw_r o il valore di MAPPING_NEBELSCHW_L/R_OUTPUT (su una F54 l''autore ha usato i valori 03/04); C_CLC_ENA = F015_enable (01); KL_ENABLE_LI/RE = KL_Ein'
    en: 'Outputs: nsw_l/nsw_r or the MAPPING_NEBELSCHW_L/R_OUTPUT value (on an F54 the author used 03/04); C_CLC_ENA = F015_enable (01); KL_ENABLE_LI/RE = KL_Ein'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Procedura completa da mini-f56-forum.de. Se nsw_l/nsw_r non funziona, copia nell''uscita il valore che trovi in MAPPING_NEBELSCHW_L/R_OUTPUT. Non toccare C_BLC_ENA se non hai i fari adattivi (AHL): su una F54 ha bloccato la regolazione manuale dei fari e acceso un errore. Servono i fendinebbia. Verifica che resti conforme all''omologazione.'
    en: 'Full procedure from mini-f56-forum.de. If nsw_l/nsw_r does not work, copy into the output the value you find in MAPPING_NEBELSCHW_L/R_OUTPUT. Do not touch C_BLC_ENA unless you have adaptive headlights (AHL): on an F54 it locked manual headlight adjustment and raised a fault. Needs fog lights. Check it stays compliant with type approval.'
  fonti:
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5668592/note.aspx
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5658504/note.aspx
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/?pageNo=222
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Lighting/Adaptive-Lighting.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: MAPPING_ABBIEGEL_L_OUTPUT=off, MAPPING_ABBIEGEL_R_OUTPUT=off, C_CLC_ENA=F015disable, KL_ENABLE_LI=KL_Aus, KL_ENABLE_RE=KL_Aus
    esito: Da verificare
  requisiti_sa:
  - 5A1
- id: bdc_body.radio-spenta-in-retromarcia-con-porta-aperta
  centralina: BDC_BODY
  titolo:
    it: 'Radio e navigazione spente aprendo la porta del guidatore'
