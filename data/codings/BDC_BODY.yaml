    it: Avviso uscita di corsia acceso a ogni avvio
    en: Lane departure warning on at every start
  descrizione:
    it: 'L''avviso di uscita di corsia è già acceso a ogni avvio, senza doverlo attivare dal tasto.'
    en: 'Lane departure warning is already on at every start, without enabling it with the button.'
