- id: bdc_body.memoria-della-modalita-di-guida
  centralina: BDC_BODY
  titolo:
    it: Memoria della modalità di guida
    en: Driving mode memory
  parametri:
  - nome: FesAllowMode4LastFunction
    target: aktiv
  - nome: FesAllowMode7LastFunction
    target: aktiv
  - nome: FesLastFunctionInterval
    regolabile: true
  valori_suggeriti:
    it: aktiv
    en: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Più utenti F5x la attivano. Abilita il ricordo solo per le modalità presenti nel tuo BDC (parametri FesHasModeN):
      sulla F54 di riferimento sono 3, 4 e 7, abilita il ricordo per quelle che vuoi mantenere al riavvio.'
    en: 'Several F5x owners enable it. Enable memory only for the modes present in your BDC (FesHasModeN parameters):
      on the reference F54 these are 3, 4 and 7. Enable it for the ones you want kept after a restart.'
  fonti:
  - https://github.com/butterflywaltz/BMW_Coding/blob/main/FDL%20Codes/BDC_FDL_Final.txt
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: bdc_body.idrive-e-radio-spenti-all-apertura-della-porta
  centralina: BDC_BODY
  titolo:
    it: 'Logica del morsetto 15 all''apertura della porta (effetto da verificare)'
    en: 'Terminal 15 logic when the door is opened (effect to be verified)'
  parametri:
  - nome: TCM_LOGIC_15_OFF_DOOR
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  note:
    it: 'Fa parte del gruppo TCM_LOGIC_15_OFF_* (spegnimento del morsetto 15: con la cintura, la chiusura, la presa OBD…). Lo spegnimento di radio e navigazione aprendo la porta è un altro parametro, TCM_LOGIC_R_OFF_DOOR. Nessuna fonte trovata riporta questo parametro: l''effetto va provato.'
    en: 'Part of the TCM_LOGIC_15_OFF_* group (terminal 15 switch-off: with the belt, locking, the OBD port…). Switching off radio and navigation when the door is opened is a different parameter, TCM_LOGIC_R_OFF_DOOR. No source found gives this parameter: the effect has to be tested.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: bdc_body.comportamento-drl-con-luci-di-posizione
  centralina: BDC_BODY
  titolo:
    it: Comportamento DRL con luci di posizione
    en: DRL behaviour with parking lights
  parametri:
  - nome: TFL_MODUS
    target: tfl_s
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Con il valore 02 l'anello si spegne quando accendi le luci di posizione. Il valore 05 lo tiene sempre acceso.
      Non lega la DRL alla posizione 0 della levetta.
    en: With value 02 the ring switches off when you turn on the parking lights. Value 05 keeps it always on. It
      does not tie the DRL to position 0 of the light switch.
  fonti:
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5658504/note.aspx
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3641570/note.aspx
  - https://minkara.carview.co.jp/userid/1685164/blog/37025176
  - https://bmw-mini-r57-60diy.blogspot.com/2017/01/f56-f57_21.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Lighting/Daytime-Running-Lights.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3515937/note.aspx
  - https://minkara.carview.co.jp/userid/208084/car/3468327/7478892/note.aspx
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: tfl_s (02)
    esito: Già attivo
