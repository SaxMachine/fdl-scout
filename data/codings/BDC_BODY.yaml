- id: bdc_body.angolo-dello-specchio-passeggero-in-retromarcia
  centralina: BDC_BODY
  titolo:
    it: Angolo dello specchio passeggero in retromarcia
    en: Passenger mirror angle in reverse
  parametri:
  - nome: ASP_BORDSTEINAUTOMATIK_DELTA
    target: '32'
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Su F54 documentato da 55 a 32: lo specchio si abbassa meno. Valore a gusto, ritocca finché vedi bene il
      marciapiede.'
    en: 'Documented on an F54 from 55 to 32: the mirror tilts down less. Adjust to taste until you can see the kerb.'
