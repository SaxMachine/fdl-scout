- id: bdc_body.lampeggio-comfort
  centralina: BDC_BODY
  titolo:
    it: Lampeggio comfort
    en: Comfort turn signal
  parametri:
  - nome: PIA_DEFAULT_TIPPBLINKEN
    regolabile: true
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Numero di lampeggi già regolabile dal menu iDrive. Se lo codifichi a mano (PIA_DEFAULT_TIPPBLINKEN o BLINKZYKLEN_ANZAHL_TIPP),
      il valore vale lampeggi meno uno: due fonti indipendenti (NAM e Xcar) riportano che 4 dà 5 lampeggi.'
    en: 'The number of flashes can already be set in the iDrive menu. If you code it by hand (PIA_DEFAULT_TIPPBLINKEN
      or BLINKZYKLEN_ANZAHL_TIPP), the value is flashes minus one: two independent sources (NAM and Xcar) report
      that 4 gives 5 flashes.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming.html
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/319265-coding-parameters-that-actually-work-using-bimmercode-expert-mode.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: —
    esito: Già attivo
- id: bdc_body.fendinebbia-come-luci-di-svolta
  centralina: BDC_BODY
  titolo:
    it: Fendinebbia come luci di svolta
    en: Fog lights as cornering lights
  parametri:
  - nome: MAPPING_ABBIEGEL_L_OUTPUT
    regolabile: true
  - nome: MAPPING_ABBIEGEL_R_OUTPUT
    regolabile: true
  - nome: C_CLC_ENA
    target: aktiv
  - nome: C_BLC_ENA
    target: aktiv
  - nome: KL_ENABLE_LI
    target: KL_Ein
  - nome: KL_ENABLE_RE
    target: KL_Ein
  valori_suggeriti:
    it: nsw_l, nsw_r (o valore hex dei fendinebbia) / aktiv / KL_Ein
    en: nsw_l, nsw_r (or the fog light hex value) / aktiv / KL_Ein
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Procedura completa da mini-f56-forum.de. Se nsw_l/nsw_r non funziona, copia nell'uscita il valore che trovi
      in MAPPING_NEBELSCHW_L/R_OUTPUT. Verifica che resti conforme all'omologazione.
    en: Full procedure from mini-f56-forum.de. If nsw_l/nsw_r does not work, copy into the output the value found
      in MAPPING_NEBELSCHW_L/R_OUTPUT. Check that it stays compliant with type approval.
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Lighting/Adaptive-Lighting.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: off / disable / KL_Aus
    esito: Da verificare
  requisiti_sa:
  - 5A1
