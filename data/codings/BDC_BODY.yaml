- id: bdc_body.tasti-della-chiave
  centralina: BDC_BODY
  titolo:
    it: Funzioni del terzo tasto della chiave e allarme panico
    en: Key fob third button and panic alarm
  descrizione:
    it: 'Sceglie cosa fa il terzo tasto della chiave con pressione breve, media e lunga - nessuna azione, apertura del baule, allarme panico o follow-me-home.'
    en: 'Chooses what the key''s third button does with a short, medium and long press - nothing, opening the boot, panic alarm or follow-me-home.'
  parametri:
  - nome: RC_PANIC_ALARM
    regolabile: true
  - nome: RC_DEFAULT_IDG_3RD_BUTTON_SHORT
    regolabile: true
  - nome: RC_DEFAULT_IDG_3RD_BUTTON_MID
    regolabile: true
  - nome: RC_DEFAULT_IDG_3RD_BUTTON_LONG
    regolabile: true
  - nome: RC_TIME_DELAY_BOOTLID
    regolabile: true
  - nome: RC_TIME_DELAY_PANIC
    regolabile: true
  valori_suggeriti:
    it: '00 nessuna azione, 02 apertura del baule, 03 allarme panico, 04 follow-me-home. Tempi in esadecimale: le fonti usano 14 per RC_TIME_DELAY_BOOTLID e 28 per RC_TIME_DELAY_PANIC.'
    en: '00 no action, 02 open boot, 03 panic alarm, 04 follow-me-home. Times in hex: sources use 14 for RC_TIME_DELAY_BOOTLID and 28 for RC_TIME_DELAY_PANIC.'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F15
  - F16
  - F20
  - F25
  - F26
  - F30
  - F48
  - F54
  - F56
  - F85
  - F86
  note:
    it: 'RC_PANIC_ALARM abilita l''allarme panico. Una fonte francese propone: breve = follow-me-home, media = baule, lunga = allarme panico. RC_TIME_DELAY_BOOTLID è per quanto va tenuto premuto il tasto del baule.'
    en: 'RC_PANIC_ALARM enables the panic alarm. A French source suggests: short = follow-me-home, medium = boot, long = panic alarm. RC_TIME_DELAY_BOOTLID is how long the boot button must be held.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: RC_PANIC_ALARM=03, RC_DEFAULT_IDG_3RD_BUTTON_SHORT=Wert_00, RC_DEFAULT_IDG_3RD_BUTTON_MID=Wert_00,
      RC_DEFAULT_IDG_3RD_BUTTON_LONG=Wert_02, RC_TIME_DELAY_BOOTLID=01, RC_TIME_DELAY_PANIC=00
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: RC_PANIC_ALARM=nicht_aktiv, RC_DEFAULT_IDG_3RD_BUTTON_SHORT=Wert_00, RC_DEFAULT_IDG_3RD_BUTTON_MID=Wert_02, RC_DEFAULT_IDG_3RD_BUTTON_LONG=Wert_00, RC_TIME_DELAY_BOOTLID=wert_01, RC_TIME_DELAY_PANIC=Wert_00
