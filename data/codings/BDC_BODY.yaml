  - https://f48.bimmerpost.com/forums/showthread/1222484/bmw-e-sys-coding-for-the-f48-x1/page/12?p=21195515
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: bdc_body.velocita-di-riapertura-degli-specchietti
  centralina: BDC_BODY
  titolo:
    it: Velocità di riapertura degli specchietti
    en: Speed at which folded mirrors reopen
  descrizione:
    it: 'Cambia la velocità oltre la quale gli specchi ripiegati si riaprono da soli.'
    en: 'Changes the speed above which folded mirrors unfold by themselves.'
  parametri:
  - nome: ASP_GESCHWINDIGKEIT_AUTO_AUSKLAPPEN
    regolabile: true
  valori_suggeriti:
    it: es. 14 (hex)
    en: e.g. 14 (hex)
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
