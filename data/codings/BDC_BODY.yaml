- id: bdc_body.fendinebbia-spenti-con-abbaglianti
  centralina: BDC_BODY
  titolo:
    it: Fendinebbia spenti quando accendi gli abbaglianti
    en: Fog lights off when you switch on the high beams
  descrizione:
    it: 'Decide se i fendinebbia si spengono quando accendi gli abbaglianti (aktiv) o restano accesi (nicht_aktiv).'
    en: 'Decides whether fog lights switch off when you turn on high beams (aktiv) or stay on (nicht_aktiv).'
