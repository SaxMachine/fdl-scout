# Codifiche note per la centralina KOMBI (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: kombi.distanza-percorsa-nel-computer-di-bordo
  centralina: KOMBI
  titolo:
    it: Distanza percorsa nel computer di bordo
    en: Distance travelled in the on-board computer
  descrizione:
    it: 'Aggiunge al computer di bordo del quadro la pagina con la distanza percorsa.'
    en: 'Adds the distance travelled page to the cluster''s on-board computer.'
  parametri:
  - nome: BC_DISTANZ_ENABLE
    target: aktiv
  - nome: KI_PIA_DISTANZ
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Servono tutti e due i parametri.'
    en: 'Both parameters are needed.'
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/?pageNo=322
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
- id: kombi.ora-di-arrivo-nel-computer-di-bordo
  centralina: KOMBI
  titolo:
    it: Ora di arrivo nel computer di bordo
    en: Arrival time in the on-board computer
  descrizione:
    it: 'Aggiunge al computer di bordo del quadro l''ora di arrivo stimata della navigazione.'
    en: 'Adds the navigation''s estimated arrival time to the cluster''s on-board computer.'
  parametri:
  - nome: KI_PIA_ANKUNFT
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Il dato (BC_ANKUNFTSZEIT_ENABLE) di solito è già attivo: questa voce aggiunge la pagina selezionabile.'
    en: 'The data (BC_ANKUNFTSZEIT_ENABLE) is usually already on: this entry adds the selectable page.'
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/?pageNo=322
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
- id: kombi.avviso-superamento-limite-nel-quadro
  centralina: KOMBI
  titolo:
    it: Avviso superamento limite nel quadro
    en: Speed limit warning in the cluster
  descrizione:
    it: 'Quando superi il limite riconosciuto, il cartello lampeggia anche nel quadro e non solo nell''HUD.'
    en: 'When you exceed the recognised limit, the sign flashes in the cluster too, not only in the HUD.'
  parametri:
  - nome: SLI_WARNUNG_ENABLE
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Nell''HUD c''è il parametro gemello HUD_SLI_WARNUNG_ENABLE. Nessuna fonte pubblica descrive questo: l''abbinamento viene dal nome nel FWL.'
    en: 'The HUD has the twin parameter HUD_SLI_WARNUNG_ENABLE. No public source describes this one: the match comes from the name in the FWL.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
- id: kombi.marcia-inserita-nell-hud
  centralina: KOMBI
  titolo:
    it: Marcia inserita nell'HUD
    en: Current gear in the HUD
  descrizione:
    it: 'Mostra nell''HUD la marcia inserita.'
    en: 'Shows the current gear in the HUD.'
  parametri:
  - nome: HUD_FAHRSTUFE_ENABLE
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Documentato su F55/F56. Sulla F54 la marcia compare già in modalità Sport con l''indicatore sportivo (voci HUD_SPORTANZEIGE_* in HU e KOMBI), anche con questo parametro spento; fuori da Sport resta un cerchietto vuoto. Cosa aggiunga questo parametro sulla F54 non è ancora verificato.'
    en: 'Documented on F55/F56. On the F54 the gear already shows in Sport mode with the sport display (HUD_SPORTANZEIGE_* entries in HU and KOMBI), even with this parameter off; outside Sport an empty circle remains. What this parameter adds on the F54 is not verified yet.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-40.html
  - https://minkara.carview.co.jp/userid/3574209/car/3489593/7495761/note.aspx
  - https://github.com/butterflywaltz/BMW_Coding/blob/main/FDL%20Codes/KOMBI_FDL_Final.txt
  - https://www.minif56.com/threads/the-other-coding-options-tracker-f55-f56-f54.40969/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
