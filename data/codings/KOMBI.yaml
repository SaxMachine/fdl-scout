  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Elenco BimmerCode. Con alcuni PSdZData il valore attuale non ha nome: scegli dalla lista E-Sys.'
    en: 'BimmerCode list. With some PSdZData the current value has no name: pick from the E-Sys list.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
