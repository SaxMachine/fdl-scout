- id: kombi.azzeramento-automatico-delle-medie
  centralina: KOMBI
  titolo:
    it: Azzeramento automatico delle medie
    en: Automatic reset of averages
  descrizione:
    it: 'Decide quando il computer di bordo azzera da solo medie e contatori del viaggio - dopo alcune ore di sosta, a ogni viaggio o mai.'
    en: 'Decides when the on-board computer resets trip averages by itself - after some hours parked, every trip or never.'
  parametri:
  - nome: BC_AUTORESET_ZEIT
    regolabile: true
  valori_suggeriti:
    it: dopo 4 h / 8 h / ogni viaggio / mai
    en: after 4 h / 8 h / every trip / never
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Le fonti BMW usano FF per non azzerarle mai e 00 per azzerarle a ogni viaggio. Con alcune versioni dei dati di E-Sys il valore attuale non ha nome: scegli dalla lista.'
    en: 'BMW sources use FF to never reset and 00 to reset every trip. With some E-Sys data versions the current value has no name: pick from the list.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Instrument-Cluster.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: '02'
    esito: Da verificare
- id: kombi.soglia-della-riserva-carburante
  centralina: KOMBI
  titolo:
    it: Soglia della riserva carburante
    en: Fuel reserve threshold
  descrizione:
    it: 'Cambia con quanti litri rimasti si accende la spia della riserva; non cambia la capacità del serbatoio.'
    en: 'Changes how many litres are left when the fuel reserve light comes on; it does not change the tank size.'
  parametri:
  - nome: TNK_SCHWELLE_RESERVE
    regolabile: true
  valori_suggeriti:
    it: valore più basso o più alto
    en: lower or higher value
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Un cheat sheet coreano usa valori da 6 a 10 litri (18, 20, 24, 28 in esadecimale). Sulle MINI lette la soglia è 11 o 12,5 litri.'
    en: 'A Korean cheat sheet uses values from 6 to 10 litres (18, 20, 24, 28 in hex). On the MINIs read the threshold is 11 or 12.5 litres.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
