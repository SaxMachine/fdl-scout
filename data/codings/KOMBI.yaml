- id: kombi.quadro-piu-luminoso-di-giorno
  centralina: KOMBI
  titolo:
    it: 'Quadro sempre con l''illuminazione diurna'
    en: 'Cluster always with daytime lighting'
  descrizione:
    it: 'Il quadro usa sempre l''illuminazione diurna, anche di notte, invece di passare alla luce notturna.'
    en: 'The cluster always uses its daytime lighting, also at night, instead of switching to night lighting.'
