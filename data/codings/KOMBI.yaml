# Codifiche note per la centralina KOMBI (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: kombi.distanza-percorsa-nel-computer-di-bordo
  centralina: KOMBI
  titolo:
    it: Distanza percorsa nel computer di bordo
    en: Distance travelled in the on-board computer
  parametri:
  - nome: BC_DISTANZ_ENABLE
    target: aktiv
  - nome: KI_PIA_DISTANZ
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Aggiunge la pagina di distanza al BC del quadro.
    en: Adds the distance page to the cluster's on-board computer.
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
- id: kombi.ora-di-arrivo-nel-computer-di-bordo
  centralina: KOMBI
  titolo:
    it: Ora di arrivo nel computer di bordo
    en: Arrival time in the on-board computer
  parametri:
  - nome: KI_PIA_ANKUNFT
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'BC_ANKUNFTSZEIT_ENABLE è già attivo: manca solo la voce selezionabile.'
    en: 'BC_ANKUNFTSZEIT_ENABLE is already active: only the selectable entry is missing.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
- id: kombi.avviso-superamento-limite-nel-quadro
  centralina: KOMBI
  titolo:
    it: Avviso superamento limite nel quadro
    en: Speed limit warning in the cluster
  parametri:
  - nome: SLI_WARNUNG_ENABLE
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: L'HUD lo fa già (HUD_SLI_WARNUNG_ENABLE). Così il segnale lampeggia anche nel quadro quando l'HUD è spento.
    en: The HUD already does it (HUD_SLI_WARNUNG_ENABLE). This makes the sign flash in the cluster too when the
      HUD is off.
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
- id: kombi.marcia-inserita-nell-hud
  centralina: KOMBI
  titolo:
    it: Marcia inserita nell'HUD
