- id: kombi.speed-limit-assist-acc-adotta-il-limite
  centralina: KOMBI
  titolo:
    it: Speed Limit Assist (ACC adotta il limite)
    en: Speed Limit Assist (ACC adopts the limit)
  parametri:
  - nome: LDM_ISA_ENABLE
    target: aktiv
  - nome: LDM_ISA_HUD_ANZ_ENABLE
    target: aktiv
  rischio: alto
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Richiede supporto in DSC e KAFAS oltre al KOMBI. Non procedere senza l'FWL del DSC.
    en: Needs support in the DSC and KAFAS as well as the KOMBI. Do not go ahead without the DSC FWL.
  fonti:
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  requisiti_sa:
  - '541'
