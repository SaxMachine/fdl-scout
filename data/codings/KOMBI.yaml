- id: kombi.speed-limit-assist-acc-adotta-il-limite
  centralina: KOMBI
  titolo:
    it: Speed Limit Assist (ACC adotta il limite)
    en: Speed Limit Assist (ACC adopts the limit)
  descrizione:
    it: 'Il cruise control attivo propone di adottare il limite di velocità letto dalla telecamera; l''indicazione compare anche nell''HUD.'
    en: 'Active cruise control offers to adopt the speed limit read by the camera; the prompt also shows in the HUD.'
  parametri:
  - nome: LDM_ISA_ENABLE
    target: aktiv
  - nome: LDM_ISA_HUD_ANZ_ENABLE
    target: aktiv
  rischio: alto
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Richiede supporto anche nel DSC e nella KAFAS oltre al KOMBI, e nessuna fonte lo ha provato su una MINI. Non procedere senza aver controllato l''FWL del DSC.'
    en: 'Also needs support in the DSC and the KAFAS besides the KOMBI, and no source has tested it on a MINI. Do not go ahead without checking the DSC FWL.'
  fonti:
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  requisiti_sa:
  - '541'
- id: kombi.limite-e-divieto-di-sorpasso-nell-hud
