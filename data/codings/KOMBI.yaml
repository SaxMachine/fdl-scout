- id: kombi.quadro-piu-luminoso-di-giorno
  centralina: KOMBI
  titolo:
    it: Quadro più luminoso di giorno
    en: Brighter cluster in daylight
  parametri:
  - nome: DIM_NACHT_EIN
    target: FF
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Fonte NAM. Gli utenti riportano un quadro molto più leggibile alla luce del sole.
    en: 'Source: NAM. Owners report a much more readable cluster in sunlight.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming.html
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/319265-coding-parameters-that-actually-work-using-bimmercode-expert-mode.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Instrument-Cluster.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv (0A)
    esito: Da verificare
- id: kombi.velocita-digitale-nel-computer-di-bordo
  centralina: KOMBI
  titolo:
    it: Velocità digitale nel computer di bordo
    en: Digital speed in the on-board computer
  parametri:
  - nome: DIGITAL_TACHO_ENABLE
    regolabile: true
  valori_suggeriti:
    it: valore digitale (lista E-Sys)
    en: digital value (E-Sys list)
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Elenco BimmerCode F5x. Mostra i km/h in cifre nel quadro. Con alcuni PSdZData il valore attuale non ha
      nome: scegli la voce kmh dalla lista.'
    en: 'BimmerCode F5x list. Shows km/h as digits in the cluster. With some PSdZData the current value has no name:
      pick the kmh entry from the list.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: '05'
    esito: Da verificare
