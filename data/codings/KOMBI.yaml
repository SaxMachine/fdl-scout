    it: 'Elenco BimmerCode F5x. Mostra i km/h in cifre nel quadro. Con alcuni PSdZData il valore attuale non ha
      nome: scegli la voce kmh dalla lista.'
    en: 'BimmerCode F5x list. Shows km/h as digits in the cluster. With some PSdZData the current value has no name:
      pick the kmh entry from the list.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
