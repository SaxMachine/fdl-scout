- id: kombi.velocita-digitale-nel-computer-di-bordo
  centralina: KOMBI
  titolo:
    it: Velocità digitale nel computer di bordo
    en: Digital speed in the on-board computer
  parametri:
  - nome: DIGITAL_TACHO_ENABLE
    regolabile: true
