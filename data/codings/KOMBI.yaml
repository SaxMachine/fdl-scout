  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Documentato su F55/F56. Le tre voci HUD_SPORTANZEIGE_* sono già attive sia in HU sia nel KOMBI: manca solo
      questa.'
    en: 'Documented on F55/F56. The three HUD_SPORTANZEIGE_* entries are already active in both the HU and the KOMBI:
      only this one is missing.'
  fonti:
  - https://minkara.carview.co.jp/userid/3574209/car/3489593/7495761/note.aspx
  - https://github.com/butterflywaltz/BMW_Coding/blob/main/FDL%20Codes/KOMBI_FDL_Final.txt
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
