    en: 'It is the KOMBI part of the activation documented on an F56: the KAFAS (SLI_ON_OFF and NPI_ON_OFF) and on the HU SPEEDLIMIT_INFO or, with EntryNav2, SLI_NAVI_DISPLAY are also needed. Needs the front camera.'
  fonti:
