    regolabile: true
  - nome: DIG_KVA_BEREICH
    regolabile: true
  valori_suggeriti:
    it: Valori in l/100 km dalla lista E-Sys (oggi 20).
    en: Values in l/100 km from the E-Sys list (currently 20).
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai: &id001
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Cambia il valore massimo della barra del consumo nel quadro.
    en: Changes the maximum value of the consumption bar in the cluster.
  fonti:
  - https://bimmercode.app/vehicles/f56
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 20l/100km / 20_l/100km
    esito: Da verificare
