- id: kombi.indicatore-sportivo-hud
  centralina: KOMBI
  titolo:
    it: Indicatore sportivo nell'HUD (parte KOMBI)
    en: Sport display in the HUD (KOMBI part)
  descrizione:
    it: 'In modalità Sport l''HUD mostra contagiri e marcia.'
    en: 'In Sport mode the HUD shows the rev counter and gear.'
  parametri:
  - nome: HUD_SPORTANZEIGE_ENABLE
    target: aktiv
  - nome: HUD_SPORTANZEIGE_FES_ENABLE
    target: aktiv
  - nome: HUD_SPORTANZEIGE_MS_GASSE_ENABLE
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Va codificata insieme alla voce sulla HU (stessi tre parametri): servono tutte e due. Serve l''HUD. Provata su F54: funziona. Dopo la codifica l''iDrive può mostrare vari errori: chiudi l''auto e aspetta 30 secondi.'
    en: 'Code it together with the HU entry (same three parameters): both are needed. Needs the HUD. Tested on F54: it works. After coding the iDrive may show various errors: lock the car and wait 30 seconds.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-24.html
  - https://www.minif56.com/threads/the-other-coding-options-tracker-f55-f56-f54.40969/
  - https://minkara.carview.co.jp/userid/3574209/car/3489593/7495761/note.aspx
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: HUD_SPORTANZEIGE_ENABLE=aktiv, HUD_SPORTANZEIGE_FES_ENABLE=aktiv, HUD_SPORTANZEIGE_MS_GASSE_ENABLE=aktiv
    esito: 'Codificata e provata: contagiri e marcia nell''HUD in Sport'
- id: kombi.limiti-velocita-nel-quadro
  centralina: KOMBI
  titolo:
    it: 'Limiti di velocità e divieto di sorpasso nel quadro (SLI)'
    en: 'Speed limits and no-passing info in the cluster (SLI)'
