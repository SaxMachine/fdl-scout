- id: kombi.temperatura-olio-numerica
  centralina: KOMBI
  titolo:
    it: Temperatura olio numerica
    en: Numeric oil temperature
  descrizione:
    it: 'Mostra la temperatura dell''olio in cifre invece che solo con la barra.'
    en: 'Shows the oil temperature as a number instead of just a bar.'
