- id: hu_nbt2.menu-ricircolo-automatico-auc-nel-clima
  centralina: HU_NBT2
  titolo:
    it: Menu ricircolo automatico (AUC) nel clima
    en: Automatic recirculation (AUC) menu in climate settings
  parametri:
  - nome: CLIMATE_AUTORECIRCULATION
    target: auc_vorhanden
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'IHKA ha AUC=AKTIV e il BDC ha il sensore (AIC_AUC_SENSOR analogico): manca solo la voce nel menu della
      HU.'
    en: 'IHKA has AUC=AKTIV and the BDC has the sensor (analogue AIC_AUC_SENSOR): only the menu entry in the HU
      is missing.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: auc_nicht_vorhanden
    esito: Consigliato
