- id: hu_nbt2.veleggio-eco-pro
  centralina: HU_NBT2
  titolo:
    it: Veleggio (coasting) nelle impostazioni ECO PRO
    en: Coasting in the ECO PRO settings
  parametri:
  - nome: EFF_DYN_SAILING
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Seconda parte: serve anche la funzione nel cambio o nella DME. Parametro presente nei FWL della F54 di riferimento; la codifica è documentata nei cheat sheet su GitHub. Una guida lo indica come parte 2 di 4 (con SEGELN_ENABLE, C_Segeln_vorhanden e Segeln nella EGS; solo cambio automatico). Nei FWL della F54 di riferimento SEGELN_ENABLE è nella KOMBI e C_Segeln_vorhanden nel DSC, entrambi già attivi; nella EGS il parametro Segeln non c''è.'
    en: 'Second part: the function is also needed in the gearbox or DME. Parameter present in the reference F54 FWL files; the coding is documented in GitHub cheat sheets. One guide gives it as part 2 of 4 (with SEGELN_ENABLE, C_Segeln_vorhanden and Segeln in the EGS; automatic only). In the reference F54 FWL files SEGELN_ENABLE is in the KOMBI and C_Segeln_vorhanden in the DSC, both already active; the EGS has no Segeln parameter.'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Transmission/Sport-Mode.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: EFF_DYN_SAILING=nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
- id: hu_nbt2.opzione-freccia-5-lampeggi
  centralina: HU_NBT2
  titolo:
    it: 'Opzione "5 lampeggi" della freccia comfort nel menu iDrive'
    en: '"5 flashes" comfort turn signal option in the iDrive menu'
  parametri:
  - nome: 5_FACH_TIPPBLINKEN
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  - G05
  note:
    it: 'Mostra la scelta dei 5 lampeggi nelle impostazioni delle luci. Il valore predefinito della freccia comfort sta nella BDC (PIA_DEFAULT_TIPPBLINKEN, vedi la voce "Lampeggio comfort"). Documentato con lo stesso nome nella head unit HU_MGU delle BMW G05.'
    en: 'Shows the 5-flash choice in the lighting settings. The default comfort turn signal value is in the BDC (PIA_DEFAULT_TIPPBLINKEN, see the "Comfort turn signal" entry). Documented with the same name in the HU_MGU head unit of BMW G05.'
  fonti:
  - https://g05.bimmerpost.com/forums/attachment.php?attachmentid=2775656
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 5_FACH_TIPPBLINKEN=aktiv
    esito: Già attivo
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: aktiv
    esito: Già attivo
