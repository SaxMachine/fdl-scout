# Codifiche note per la centralina HU_NBT2 (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: hu_nbt2.menu-ricircolo-automatico-auc-nel-clima
  centralina: HU_NBT2
  titolo:
    it: Menu ricircolo automatico (AUC) nel clima
    en: Automatic recirculation (AUC) menu in climate settings
  parametri:
  - nome: CLIMATE_AUTORECIRCULATION
    target: auc_vorhanden
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'IHKA ha AUC=AKTIV e il BDC ha il sensore (AIC_AUC_SENSOR analogico): manca solo la voce nel menu della HU. Nessuna fonte trovata riporta il nome del parametro: l''abbinamento con la funzione viene dal nome presente nel FWL della F54.'
    en: 'IHKA has AUC=AKTIV and the BDC has the sensor (analogue AIC_AUC_SENSOR): only the menu entry in the HU is missing. No source found gives the parameter name: the match with the function comes from the name in the F54 FWL.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: auc_nicht_vorhanden
    esito: Consigliato
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: auc_nicht_vorhanden
    esito: Parametro presente, non provato
- id: hu_nbt2.voce-menu-chiusura-automatica-in-marcia
  centralina: HU_NBT2
  titolo:
    it: Voce menu chiusura automatica in marcia
    en: Menu entry for automatic locking when driving off
  parametri:
  - nome: DOOR_LOCK_AFTER_DRIVING_AWAY
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F56
  note:
    it: La logica è nel BDC (CLI_DEFAULT_LOCK_AT_SPEED già impostato). Così la gestisci dalle impostazioni del veicolo.
    en: The logic is in the BDC (CLI_DEFAULT_LOCK_AT_SPEED already set). This lets you manage it from the vehicle
      settings.
  fonti:
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
- id: hu_nbt2.voce-menu-ribaltamento-specchietti-alla-chiusura
  centralina: HU_NBT2
  titolo:
    it: Voce menu ribaltamento specchietti alla chiusura
    en: Menu entry for folding mirrors when locking
  parametri:
  - nome: SETTINGS_AUTOMATIC_EXT_MIRROR_FOLDING
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: Nel BDC ASP_BEIKLAPPEN è già attivo. Sulla grafica MINI la voce non sempre compare.
    en: ASP_BEIKLAPPEN is already active in the BDC. With the MINI graphics the entry does not always appear.
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
  requisiti_sa:
  - '313'
- id: hu_nbt2.memoria-sedile-richiamata-dalla-chiave
  centralina: HU_NBT2
  titolo:
    it: Memoria sedile richiamata dalla chiave
    en: Seat memory recalled by the key
  parametri:
  - nome: DOORLOCKING_SEATMEMORY
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  note:
    it: 'Richiede SA 459 e la centralina SMFA. Serve anche il parametro corrispondente in SMFA, ancora da mappare. Nessuna fonte trovata riporta il nome del parametro: l''abbinamento con la funzione viene dal nome presente nel FWL della F54.'
    en: 'Requires SA 459 and the SMFA unit. The matching SMFA parameter, not yet mapped, is also needed. No source found gives the parameter name: the match with the function comes from the name in the F54 FWL.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  requisiti_sa:
  - '459'
- id: hu_nbt2.voce-menu-conferma-acustica-di-chiusura
  centralina: HU_NBT2
  titolo:
    it: Voce menu conferma acustica di chiusura
    en: Menu entry for the audible lock confirmation
  parametri:
  - nome: ACOUSTICAL_LOCK_CONFIRM
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Secondo le fonti aggiunge al menu iDrive la voce per accendere o spegnere il segnale acustico di chiusura. Il suono lo dà il BDC con VAM_HORN_AT_SECURE: sulla F54 di riferimento l''auto suona alla chiusura anche con questo parametro spento e senza la voce nel menu.'
    en: 'According to the sources it adds the iDrive menu entry to switch the audible lock signal on or off. The sound itself comes from the BDC via VAM_HORN_AT_SECURE: on the reference F54 the car beeps on locking even with this parameter off and no menu entry.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-12.html
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: hu_nbt2.riscaldamento-sedili-automatico
  centralina: HU_NBT2
  titolo:
    it: Riscaldamento sedili automatico
    en: Automatic seat heating
  parametri:
  - nome: AKT_AUTO_SITZE_FRONT
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Accende i sedili in base alla temperatura esterna. Su IHKA monozona MINI il supporto non è garantito. Il parametro è documentato con lo stesso nome nella head unit HU_MGU delle BMW G05.'
    en: 'Switches the seats on depending on the outside temperature. Support is not guaranteed with the MINI single-zone IHKA. The parameter is documented with the same name in the HU_MGU head unit of BMW G05.'
  fonti:
  - https://g05.bimmerpost.com/forums/attachment.php?attachmentid=2775656
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
  requisiti_sa:
  - '494'
- id: hu_nbt2.distanza-alla-prossima-svolta-nell-hud
  centralina: HU_NBT2
  titolo:
    it: 'Distanza dell''ACC nell''HUD (parte HU)'
    en: 'ACC distance in the HUD (HU part)'
  parametri:
  - nome: HUD_DISTANCE_INFO
    target: aktiv
  - nome: HUD_CB_ABSTANDSINFO
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Le fonti la indicano come parte 2 di 3 della distanza ACC nell''HUD, insieme alle voci in KOMBI e KAFAS. Non è la distanza dalla prossima svolta della navigazione. Serve l''ACC.'
    en: 'Sources give it as part 2 of 3 of the ACC distance in the HUD, together with the KOMBI and KAFAS entries. It is not the distance to the next navigation turn. Requires ACC.'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/HUD.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/jokinawa.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
