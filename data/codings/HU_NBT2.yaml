    en: 'It is part of a four-unit procedure described on an F54 (minif56): KOMBI TLC_VERBAUT and ST_TLC_*; BDC ComAdapterPdu_18A_Steuerung_Vibration_Lenkrad and SPURVERLASSENS_WARNUNG; KAFAS TLC_ON_OFF, SEND_MSG_327/18A, TLC_START_VERSION 01 and DT_LNDT_SEND; HU LANE_DEPARTURE_WARNING. Needs the KAFAS camera.'
