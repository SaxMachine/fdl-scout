- id: hu_nbt2.veleggio-eco-pro
  centralina: HU_NBT2
  titolo:
    it: Veleggio (coasting) nelle impostazioni ECO PRO
    en: Coasting in the ECO PRO settings
  descrizione:
    it: 'Aggiunge nelle impostazioni ECO PRO la voce del veleggio, in cui il motore si stacca quando togli il piede dall''acceleratore.'
    en: 'Adds the coasting item to the ECO PRO settings, where the engine is disengaged when you lift off the accelerator.'
  parametri:
  - nome: EFF_DYN_SAILING
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Una guida la indica come parte 2 di 4, con SEGELN_ENABLE nel KOMBI, C_Segeln_vorhanden nel DSC e Segeln nel cambio (EGS); solo cambio automatico. Sulle MINI lette le parti di KOMBI e DSC sono già attive, mentre nella EGS il parametro Segeln non c''è.'
    en: 'One guide gives it as part 2 of 4, with SEGELN_ENABLE in the KOMBI, C_Segeln_vorhanden in the DSC and Segeln in the gearbox (EGS); automatic gearbox only. On the MINIs read the KOMBI and DSC parts are already on, while the EGS has no Segeln parameter.'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Transmission/Sport-Mode.md
  osservazioni:
  - telaio: F54
