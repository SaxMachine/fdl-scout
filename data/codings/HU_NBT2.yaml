- id: hu_nbt2.avviso-superamento-corsia-nel-menu
  centralina: HU_NBT2
  titolo:
    it: 'Avviso uscita di corsia: voce nel menu iDrive'
    en: 'Lane departure warning: entry in the iDrive menu'
  parametri:
  - nome: LANE_DEPARTURE_WARNING
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Parte di una procedura su quattro centraline. Nella F54 di riferimento KOMBI, BDC e gran parte della KAFAS
      sono già pronti: mancano questa voce e le due della KAFAS. Procedura completa su F54 (minif56): KOMBI TLC_VERBAUT,
      ST_TLC_*; BDC ComAdapterPdu_18A_Steuerung_Vibration_Lenkrad e SPURVERLASSENS_WARNUNG; KAFAS TLC_ON_OFF, SEND_MSG_327/18A;
      HU LANE_DEPARTURE_WARNING; KAFAS TLC_START_VERSION 01 e DT_LNDT_SEND. Un utente F54 l''ha attivata senza montare
      il motorino di vibrazione: la vibrazione è leggera. Richiede la telecamera KAFAS.'
    en: 'Part of a procedure across four units. On the reference F54 the KOMBI, the BDC and most of the KAFAS are
      already set up: this entry and the two KAFAS ones are missing. Full procedure on an F54 (minif56): KOMBI TLC_VERBAUT,
      ST_TLC_*; BDC ComAdapterPdu_18A_Steuerung_Vibration_Lenkrad and SPURVERLASSENS_WARNUNG; KAFAS TLC_ON_OFF,
      SEND_MSG_327/18A; HU LANE_DEPARTURE_WARNING; KAFAS TLC_START_VERSION 01 and DT_LNDT_SEND. One F54 owner enabled
      it without fitting the vibration motor: the vibration is light. Requires the KAFAS camera.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  fonti:
  - https://www.minif56.com/threads/lane-departure-warning-coding-on-f54-clubman.89617/
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
