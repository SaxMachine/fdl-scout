- id: hu_nbt2.menu-livello-olio-elettronico
  centralina: HU_NBT2
  titolo:
    it: Menu livello olio elettronico
    en: Electronic oil level menu
  parametri:
  - nome: OELSTANDSMENUE
    target: aktiv
  - nome: OELSTAND_OENS
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Mostra il livello olio nell''iDrive. Funziona solo se il B48 ha il sensore OENS; altrimenti il menu resta vuoto. Nessuna fonte trovata riporta il nome del parametro: l''abbinamento con la funzione viene dal nome presente nel FWL della F54.'
    en: 'Shows the oil level in iDrive. It only works if the B48 has the OENS sensor; otherwise the menu stays empty. No source found gives the parameter name: the match with the function comes from the name in the F54 FWL.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: OELSTANDSMENUE=nicht_aktiv, OELSTAND_OENS=nicht_aktiv
    esito: Parametro presente, non provato
