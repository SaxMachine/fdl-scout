# Codifiche note per la centralina HU_NBT2 (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: hu_nbt2.menu-ricircolo-automatico-auc-nel-clima
  centralina: HU_NBT2
  titolo:
    it: Menu ricircolo automatico (AUC) nel clima
    en: Automatic recirculation (AUC) menu in climate settings
  descrizione:
    it: 'Aggiunge nel menu del clima la voce del ricircolo automatico (AUC), che chiude le prese d''aria quando il sensore rileva aria inquinata.'
    en: 'Adds the automatic recirculation (AUC) item to the climate menu, which closes the air intake when the sensor detects polluted air.'
  parametri:
  - nome: CLIMATE_AUTORECIRCULATION
    target: auc_vorhanden
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Serve il sensore della qualità dell''aria (AUC) e la funzione attiva nel clima (IHKA AUC). Nessuna fonte pubblica descrive il parametro: l''abbinamento viene dal nome nel FWL.'
    en: 'Needs the air quality sensor (AUC) and the function enabled in the climate unit (IHKA AUC). No public source describes the parameter: the match comes from the name in the FWL.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: auc_nicht_vorhanden
    esito: Consigliato
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: auc_nicht_vorhanden
    esito: Parametro presente, non provato
- id: hu_nbt2.voce-menu-chiusura-automatica-in-marcia
  centralina: HU_NBT2
  titolo:
    it: Voce menu chiusura automatica in marcia
    en: Menu entry for automatic locking when driving off
  descrizione:
    it: 'Aggiunge nelle impostazioni del veicolo la voce per far chiudere le porte da sole quando parti.'
    en: 'Adds the setting to lock the doors automatically when you drive off.'
  parametri:
  - nome: DOOR_LOCK_AFTER_DRIVING_AWAY
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F56
  note:
    it: 'La chiusura vera e propria la fa il BDC (CLI_DEFAULT_LOCK_AT_SPEED); questa voce serve a gestirla dal menu.'
    en: 'The locking itself is done by the BDC (CLI_DEFAULT_LOCK_AT_SPEED); this entry lets you manage it from the menu.'
  fonti:
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Consigliato
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
- id: hu_nbt2.voce-menu-ribaltamento-specchietti-alla-chiusura
  centralina: HU_NBT2
  titolo:
    it: Voce menu ribaltamento specchietti alla chiusura
    en: Menu entry for folding mirrors when locking
  descrizione:
    it: 'Aggiunge in iDrive la voce per scegliere se gli specchietti si ripiegano quando chiudi l''auto.'
    en: 'Adds the iDrive setting to choose whether the mirrors fold when you lock the car.'
  parametri:
  - nome: SETTINGS_AUTOMATIC_EXT_MIRROR_FOLDING
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'La fonte la indica per G12 e G30 con firmware da 11-16 in poi. Il ripiegamento lo fa il BDC (ASP_BEIKLAPPEN). Sulla grafica MINI la voce non sempre compare.'
    en: 'The source gives it for G12 and G30 with firmware 11-16 or later. The folding itself is done by the BDC (ASP_BEIKLAPPEN). On the MINI graphics the item does not always appear.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
  requisiti_sa:
  - '313'
- id: hu_nbt2.memoria-sedile-richiamata-dalla-chiave
  centralina: HU_NBT2
  titolo:
    it: Memoria sedile richiamata dalla chiave
    en: Seat memory recalled by the key
  descrizione:
    it: 'Nessuna fonte descrive questo parametro. Dal nome è la funzione che richiama la posizione del sedile memorizzata quando apri l''auto con la tua chiave.'
    en: 'No source describes this parameter. From its name it is the function that recalls the stored seat position when you unlock with your key.'
  parametri:
  - nome: DOORLOCKING_SEATMEMORY
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  note:
    it: 'Serve il sedile elettrico con memoria (SA 459) e la centralina SMFA, dove il parametro corrispondente non è ancora stato trovato.'
    en: 'Needs the electric seat with memory (SA 459) and the SMFA unit, where the matching parameter has not been found yet.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  requisiti_sa:
  - '459'
- id: hu_nbt2.voce-menu-conferma-acustica-di-chiusura
  centralina: HU_NBT2
  titolo:
    it: Voce menu conferma acustica di chiusura
    en: Menu entry for the audible lock confirmation
  descrizione:
    it: 'Aggiunge in iDrive la voce per accendere o spegnere il segnale acustico quando chiudi e apri l''auto.'
    en: 'Adds the iDrive setting to switch the audible signal on locking and unlocking on or off.'
  parametri:
  - nome: ACOUSTICAL_LOCK_CONFIRM
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Il segnale è quello della sirena dell''allarme: un cheat sheet BMW dice che la voce compare solo con l''allarme, uno coreano che serve il cicalino dell''antifurto. Su una F54 con allarme il parametro risulta spento e la voce non compare nel menu.'
    en: 'The signal comes from the alarm siren: a BMW cheat sheet says the item only appears with the alarm, a Korean one that the anti-theft buzzer is needed. On an F54 with an alarm the parameter reads off and the item does not appear in the menu.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-12.html
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: hu_nbt2.riscaldamento-sedili-automatico
  centralina: HU_NBT2
  titolo:
    it: Riscaldamento sedili automatico
    en: Automatic seat heating
  descrizione:
    it: 'Aggiunge in iDrive l''accensione automatica del riscaldamento dei sedili in base alla temperatura.'
    en: 'Adds automatic seat heating in iDrive, based on the temperature.'
  parametri:
  - nome: AKT_AUTO_SITZE_FRONT
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Il parametro è documentato con lo stesso nome nella head unit HU_MGU delle BMW G05; nessuna fonte lo ha provato su una MINI. Serve il riscaldamento dei sedili.'
    en: 'The parameter is documented under the same name in the HU_MGU head unit of the BMW G05; no source has tested it on a MINI. Needs heated seats.'
  fonti:
  - https://g05.bimmerpost.com/forums/attachment.php?attachmentid=2775656
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: nicht_aktiv
    esito: Parametro presente, non provato
  requisiti_sa:
  - '494'
- id: hu_nbt2.distanza-alla-prossima-svolta-nell-hud
  centralina: HU_NBT2
  titolo:
    it: 'Distanza dell''ACC nell''HUD (parte HU)'
    en: 'ACC distance in the HUD (HU part)'
  descrizione:
    it: 'È la parte della HU che serve a mostrare nell''HUD la distanza dell''ACC dal veicolo davanti.'
    en: 'It is the HU part needed to show the ACC distance to the vehicle ahead in the HUD.'
  parametri:
  - nome: HUD_DISTANCE_INFO
    target: aktiv
  - nome: HUD_CB_ABSTANDSINFO
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Le fonti la danno come parte 2 di 3, insieme alle voci nel KOMBI e nella KAFAS. Non è la distanza dalla prossima svolta della navigazione. Serve il cruise control attivo (ACC) e l''HUD.'
    en: 'Sources give it as part 2 of 3, together with the KOMBI and KAFAS entries. It is not the distance to the next navigation turn. Needs active cruise control (ACC) and the HUD.'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/HUD.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/jokinawa.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: hu_nbt2.interruttore-luci-diurne-nel-menu-idrive
  centralina: HU_NBT2
  titolo:
    it: Interruttore luci diurne nel menu iDrive
    en: Daytime running lights switch in the iDrive menu
  descrizione:
    it: 'Aggiunge nel menu luci dell''iDrive la voce per accendere o spegnere le luci diurne.'
    en: 'Adds the item to switch daytime running lights on or off to the iDrive lighting menu.'
  parametri:
  - nome: DAYDRIVING_LIGHT
    target: standard
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Confermata su F54 e F56 con il passaggio da perm_off o perm_on a standard. Una fonte francese la dà come parte 2 di 3 con FEM_BODY e REM, ma sulle MINI basta la HU.'
    en: 'Confirmed on F54 and F56 by changing perm_off or perm_on to standard. A French source gives it as part 2 of 3 with FEM_BODY and REM, but on MINIs the HU is enough.'
  fonti:
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3515937/note.aspx
  - https://minkara.carview.co.jp/userid/125014/car/2087329/5550627/note.aspx
