  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://minkara.carview.co.jp/userid/208084/car/3468327/7478892/note.aspx
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=125
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: perm_off
    esito: Consigliato
- id: hu_nbt2.video-da-chiavetta-usb
  centralina: HU_NBT2
  titolo:
    it: Video da chiavetta USB
    en: Video from a USB stick
  descrizione:
    it: 'Permette di guardare sullo schermo i video da una chiavetta USB.'
    en: 'Lets you watch videos from a USB stick on the screen.'
  parametri:
  - nome: API_USB_VIDEO
    target: both
  - nome: ENT_CODEC_XVID
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Servono tutti e due i parametri: API_USB_VIDEO = both e il codec XVID. Confermata su una F54. Il video si vede solo a vettura ferma, a meno di togliere anche i blocchi in marcia.'
    en: 'Both parameters are needed: API_USB_VIDEO = both and the XVID codec. Confirmed on an F54. Video only plays when stationary, unless the driving locks are also removed.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-7.html
  - https://minkara.carview.co.jp/userid/125014/car/2087329/3515937/note.aspx
  - https://minkara.carview.co.jp/userid/125014/car/2087329/5550627/note.aspx
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: none / nicht_aktiv
    esito: Consigliato
- id: hu_nbt2.cambio-ora-legale-automatico
  centralina: HU_NBT2
