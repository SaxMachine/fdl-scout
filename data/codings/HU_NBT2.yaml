- id: hu_nbt2.menu-livello-olio-elettronico
  centralina: HU_NBT2
  titolo:
    it: Menu livello olio elettronico
    en: Electronic oil level menu
  descrizione:
    it: 'Mostra in iDrive il livello dell''olio misurato dal sensore.'
    en: 'Shows the oil level measured by the sensor in iDrive.'
  parametri:
  - nome: OELSTANDSMENUE
    target: aktiv
  - nome: OELSTAND_OENS
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Funziona solo se il motore ha il sensore di livello olio (OENS); altrimenti il menu resta vuoto. Nessuna fonte pubblica descrive i parametri: l''abbinamento viene dal nome nel FWL.'
    en: 'Only works if the engine has the oil level sensor (OENS); otherwise the menu stays empty. No public source describes the parameters: the match comes from the name in the FWL.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: OELSTANDSMENUE=nicht_aktiv, OELSTAND_OENS=nicht_aktiv
    esito: Parametro presente, non provato
