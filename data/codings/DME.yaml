# Codifiche note per la centralina DME (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: dme.carica-batteria-al-100
  centralina: DME
  titolo:
    it: Batteria caricata al 100% (niente recupero in rilascio)
    en: Battery charged to 100% (no regeneration)
  descrizione:
    it: 'La batteria viene caricata fino al 100% invece di circa l''80%, rinunciando alla ricarica in rilascio (IGR).'
    en: 'The battery is charged to 100% instead of about 80%, giving up regenerative charging when coasting (IGR).'
  parametri:
  - nome: IGR
    regolabile: true
  valori_suggeriti:
    it: 00 nella fonte
    en: 00 in the source
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'La fonte imposta 00. Il recupero di energia in rilascio serve a consumare un po'' meno: spegnendolo la batteria resta più carica ma l''efficienza cala leggermente. È una codifica della centralina motore.'
    en: 'The source sets 00. Regeneration when coasting saves a little fuel: turning it off keeps the battery fuller but slightly lowers efficiency. This is an engine unit coding.'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Transmission/Sport-Mode.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: IGR=Wert_01
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: Wert_01
    esito: Parametro presente, non provato
- id: dme.memoria-start-stop
  centralina: DME
  titolo:
    it: 'Memoria Start/Stop (parte DME)'
    en: 'Start/Stop memory (DME part)'
  descrizione:
    it: 'Secondo le fonti BMW la centralina motore ricorda se avevi spento lo Start/Stop, anche dopo aver spento e riacceso.'
    en: 'According to BMW sources the engine unit remembers whether you had turned Start/Stop off, even after switching off and on again.'
  parametri:
  - nome: TCM_MSA_MEMORY
    target: '01'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  - G11
  - G30
  note:
    it: 'Documentata sulla DME di G11/G30; una guida dice che ricorda lo stato anche a motore spento con quadro acceso. Sulla F54 non serve: la memoria funziona con la sola voce nel BDC (provata), con questo parametro a Wert_00.'
    en: 'Documented on the G11/G30 DME; one guide says it keeps the state also with the engine off and ignition on. On the F54 it is not needed: the memory works with the BDC entry alone (tested), with this parameter at Wert_00.'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Start-Stop.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/stanleyy.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: TCM_MSA_MEMORY=Wert_00
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: Wert_00
    esito: Parametro presente, non provato
