# Codifiche note per la centralina FEM_BODY (BMW serie F con FEM: F20, F30, F80…; i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: fem_body.ritardo-apertura-baule-piede
  centralina: FEM_BODY
  titolo:
    it: 'Ritardo di apertura del baule col piede (Comfort Access)'
    en: 'Kick-to-open boot delay (Comfort Access)'
  descrizione:
    it: 'Riduce o toglie l''attesa tra il movimento del piede sotto il paraurti e l''apertura del baule.'
    en: 'Shortens or removes the wait between the foot movement under the bumper and the boot opening.'
  parametri:
  - nome: CLM_TIMEOUT_HK_SMO
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale a passi di 0,1 s: 01 = 0,1 s, 02 = 0,3 s secondo una fonte (di fabbrica circa 0,7 s), 00 = nessun ritardo.'
    en: 'Hexadecimal, 0.1 s steps: 01 = 0.1 s, 02 = 0.3 s per one source (factory about 0.7 s), 00 = no delay.'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F20
  - F30
  - F80
  - F82
  note:
    it: 'Solo con Comfort Access e apertura col piede (Smart Opener). Questo è il nome sulle BMW con FEM; sulle MINI con BDC la stessa funzione è VAM_TIMEOUT_HK_SMO (voce del BDC).'
    en: 'Only with Comfort Access and kick opening (Smart Opener). This is the name on BMWs with a FEM; on MINIs with a BDC the same function is VAM_TIMEOUT_HK_SMO (BDC entry).'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Windows-Doors.md
- id: fem_body.lampeggio-apertura-baule-piede
  centralina: FEM_BODY
  titolo:
    it: 'Niente lampeggio delle luci aprendo il baule col piede'
    en: 'No light flashing when opening the boot with a kick'
  descrizione:
    it: 'Le luci posteriori non lampeggiano più quando apri il baule col piede.'
    en: 'The tail lights no longer flash when you open the boot with your foot.'
  parametri:
  - nome: CLM_SMO_INDICATOR
    target: nicht_aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F20
  - F30
  - F80
  - F82
  note:
    it: 'Solo con Comfort Access e Smart Opener. Documentata sul FEM delle BMW; non trovata nel BDC delle MINI.'
    en: 'Only with Comfort Access and Smart Opener. Documented on the BMW FEM; not found in the MINI BDC.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Windows-Doors.md
- id: fem_body.ritardo-apertura-baule-tasto
  centralina: FEM_BODY
  titolo:
    it: 'Ritardo di sblocco del baule (senza Smart Opener)'
    en: 'Boot unlock delay (without Smart Opener)'
  descrizione:
    it: 'Riduce o toglie il ritardo con cui il baule si sblocca dal tasto, senza Smart Opener.'
    en: 'Shortens or removes the delay before the boot unlocks from the button, without Smart Opener.'
  parametri:
  - nome: CLM_TIME_DELAY_BOOTLID
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale; una fonte indica wert_01 = 0,1 s (di fabbrica 0,3 s), un''altra 00 = nessun ritardo.'
    en: 'Hexadecimal; one source gives wert_01 = 0.1 s (factory 0.3 s), another 00 = no delay.'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F20
  - F30
  - F80
  note:
    it: 'Una fonte indica 0,3 s di fabbrica. Il tempo per cui va tenuto premuto il tasto del baule sul telecomando è un altro parametro (RC_TIME_DELAY_BOOTLID).'
    en: 'One source gives 0.3 s from the factory. How long you must hold the boot button on the key is another parameter (RC_TIME_DELAY_BOOTLID).'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
- id: fem_body.tempo-richiusura-automatica
  centralina: FEM_BODY
  titolo:
    it: 'Tempo prima della richiusura automatica'
    en: 'Time before automatic relocking'
  descrizione:
    it: 'Se apri l''auto con la chiave e non apri nessuna porta, si richiude da sola dopo questo tempo.'
    en: 'If you unlock the car with the key and open no door, it locks itself again after this time.'
  parametri:
  - nome: CLM_TIME_PIA_LOCK_AT_TIMEOUT
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale in unità di 10 s: 03 = 30 s, 0C = 120 s (di fabbrica secondo le fonti BMW).'
    en: 'Hexadecimal in 10 s units: 03 = 30 s, 0C = 120 s (factory per BMW sources).'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F20
  - F30
  - F80
  - F82
  note:
    it: 'Serve la richiusura automatica attiva (CLI_DEFAULT_LOCK_AT_TIMEOUT). Le fonti BMW indicano 120 s di fabbrica; una fonte coreana usa 18 s.'
    en: 'Needs automatic relocking on (CLI_DEFAULT_LOCK_AT_TIMEOUT). BMW sources give 120 s from the factory; a Korean source uses 18 s.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Body/Windows-Doors.md
