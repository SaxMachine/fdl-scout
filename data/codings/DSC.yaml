# Codifiche note per la centralina DSC (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: dsc.limitatore-di-velocita-gamma-regolabile
  centralina: DSC
  titolo:
    it: 'Limitatore di velocità: gamma regolabile'
    en: 'Speed limiter: adjustable range'
  parametri:
  - nome: C_SLD_vmin_kmh
    regolabile: true
  - nome: C_SLD_vmax_kmh
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Fonte mini-f56-forum.de.
    en: 'Source: mini-f56-forum.de.'
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 30 / 250
    esito: Da verificare
- id: dsc.acc-velocita-massima-e-minima
  centralina: DSC
  titolo:
    it: 'ACC: velocità massima e minima impostabili'
    en: 'ACC: maximum and minimum set speed'
  parametri:
  - nome: C_Wunschgeschw_ACC_max_kmh
    regolabile: true
  - nome: C_Wunschgeschw_min_kmh
    regolabile: true
  valori_suggeriti:
    it: Velocità in km/h dalla lista E-Sys.
    en: Speed in km/h from the E-Sys list.
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Sulle F5x con ACC a telecamera questi limiti stanno nel DSC, non in una centralina SAS separata. Nella F54
      di riferimento il massimo ACC è initwert (non impostato) e il minimo 30 km/h. La ripartenza automatica (C_Funktion_AccStopAndGo_aktiv_I)
      risulta già attiva.
    en: On F5x with camera-based ACC these limits are in the DSC, not in a separate SAS unit. On the reference F54
      the ACC maximum is initwert (not set) and the minimum 30 km/h. Automatic restart (C_Funktion_AccStopAndGo_aktiv_I)
      is already active.
  fonti:
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://www.minif56.com/threads/active-cruise-control-541-activating-stop-and-go.87884/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: initwert / 30
    esito: Da verificare
  requisiti_sa:
  - '541'
- id: dsc.limitatore-di-velocita
  centralina: DSC
  titolo:
    it: Limitatore di velocità (LIM)
    en: Speed limiter (LIM)
  parametri:
  - nome: C_SLD_Funktion
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Il quadro ha già SLD_ENABLE aktiv e il DSC ha C_SpeedLimitDevice_I aktiv, ma la funzione C_SLD_Funktion
      è spenta. Su Bimmerfest la combinazione KOMBI SLD_ENABLE + DSC C_SLD_Funktion attiva il limitatore con il
      tasto del cruise control. La gamma regolabile è nella voce ''Limitatore di velocità: gamma regolabile''.'
    en: 'The cluster already has SLD_ENABLE aktiv and the DSC has C_SpeedLimitDevice_I aktiv, but the C_SLD_Funktion
      function is off. On Bimmerfest, KOMBI SLD_ENABLE together with DSC C_SLD_Funktion enables the limiter on the
      cruise control button. The adjustable range is in the entry ''Speed limiter: adjustable range''.'
  fonti:
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: dsc.impostazioni-dsc-m-usa
  centralina: DSC
  titolo:
    it: 'DSC: impostazioni MDM delle M USA'
    en: 'DSC: US M Dynamic Mode settings'
  parametri:
  - nome: C_AMR_2_c
    regolabile: true
  - nome: C_AMR_3_c
    regolabile: true
  valori_suggeriti:
    it: 00 nella fonte F80
    en: 00 in the F80 source
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F54
  - F80
  note:
    it: 'Impostazioni del controllo di stabilità per M3/M4 F80/F82 USA. Su altre auto: sconsigliata. Parametro presente
      nei FWL della F54 di riferimento; la codifica è documentata nei cheat sheet su GitHub.'
    en: 'Stability control settings for US M3/M4 F80/F82. On other cars: not recommended. Parameter present in the
      reference F54 FWL files; the coding is documented in GitHub cheat sheets.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_AMR_2_c=1, C_AMR_3_c=0
    esito: Da verificare
- id: dsc.dynamic-brake-control
  centralina: DSC
  titolo:
    it: Dynamic Brake Control
    en: Dynamic Brake Control
  parametri:
  - nome: C_Funktion_DynamicBrakeControl_aktiv_I
    target: '01'
  rischio: alto
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Fonte F55/F56/F57/F45: va attivata insieme al cambio (EGS). Riguarda la frenata: prova con prudenza. Parametro
      presente nei FWL della F54 di riferimento; la codifica è documentata nei cheat sheet su GitHub.'
    en: 'F55/F56/F57/F45 source: enable it together with the gearbox (EGS). Affects braking: test carefully. Parameter
      present in the reference F54 FWL files; the coding is documented in GitHub cheat sheets.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_Funktion_DynamicBrakeControl_aktiv_I=02
    esito: Da verificare
