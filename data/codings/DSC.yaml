# Codifiche note per la centralina DSC (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: dsc.limitatore-di-velocita-gamma-regolabile
  centralina: DSC
  titolo:
    it: 'Limitatore di velocità: gamma regolabile'
    en: 'Speed limiter: adjustable range'
  descrizione:
    it: 'Cambia la velocità minima e massima che puoi impostare nel limitatore di velocità.'
    en: 'Changes the minimum and maximum speed you can set in the speed limiter.'
  parametri:
  - nome: C_SLD_vmin_kmh
    regolabile: true
  - nome: C_SLD_vmax_kmh
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Serve il limitatore attivo (voce "Limitatore di velocità (LIM)"). Velocità in km/h dalla lista E-Sys. Fonte: forum MINI tedesco.'
    en: 'Needs the limiter enabled (entry "Speed limiter (LIM)"). Speeds in km/h from the E-Sys list. Source: German MINI forum.'
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 30 / 250
    esito: Da verificare
- id: dsc.acc-velocita-massima-e-minima
  centralina: DSC
  titolo:
    it: 'ACC: velocità massima e minima impostabili'
    en: 'ACC: maximum and minimum set speed'
  descrizione:
    it: 'Cambia la velocità massima e minima che puoi impostare nel cruise control attivo (ACC); le fonti lo abbassano fino a 10 km/h.'
    en: 'Changes the maximum and minimum speed you can set in active cruise control (ACC); sources lower it down to 10 km/h.'
  parametri:
  - nome: C_Wunschgeschw_ACC_max_kmh
    regolabile: true
  - nome: C_Wunschgeschw_min_kmh
    regolabile: true
  valori_suggeriti:
    it: Velocità in km/h dalla lista E-Sys.
    en: Speed in km/h from the E-Sys list.
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Di fabbrica il minimo è 30 km/h (1E). Questi limiti esistono sia nel DSC (C_Wunschgeschw_*) sia nella SAS (LDM_Wunschgeschw_*, vedi la voce SAS): non è documentato quale dei due valga sulle MINI. Le fonti BMW li danno nel DSC, il forum tedesco nell''ICM di una F55 senza SAS.'
    en: 'Factory minimum is 30 km/h (1E). These limits exist both in the DSC (C_Wunschgeschw_*) and in the SAS (LDM_Wunschgeschw_*, see the SAS entry): it is not documented which one applies on MINIs. BMW sources put them in the DSC, the German forum in the ICM of an F55 without SAS.'
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/?pageNo=286
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_Wunschgeschw_ACC_max_kmh=initwert, C_Wunschgeschw_min_kmh=30
    esito: Da verificare
  requisiti_sa:
  - '541'
- id: dsc.limitatore-di-velocita
  centralina: DSC
  titolo:
    it: Limitatore di velocità (LIM)
    en: Speed limiter (LIM)
  descrizione:
    it: 'Attiva il limitatore di velocità (LIM), che si comanda dai tasti del cruise control.'
    en: 'Enables the speed limiter (LIM), operated from the cruise control buttons.'
  parametri:
  - nome: C_SLD_Funktion
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Va con la parte nel KOMBI (SLD_ENABLE): su Bimmerfest la combinazione KOMBI SLD_ENABLE + DSC C_SLD_Funktion attiva il limitatore. Una guida cita anche C_Umschaltung_ACC_DCC = zugelassen e LDM_SET_Taste; sulle MINI lette il primo è già zugelassen e il secondo non esiste. La gamma è nella voce "Limitatore di velocità: gamma regolabile".'
    en: 'Goes with the KOMBI part (SLD_ENABLE): on Bimmerfest the KOMBI SLD_ENABLE + DSC C_SLD_Funktion combination enables the limiter. One guide also mentions C_Umschaltung_ACC_DCC = zugelassen and LDM_SET_Taste; on the MINIs read the first is already zugelassen and the second does not exist. The range is in the entry "Speed limiter: adjustable range".'
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Instrument-Cluster.md
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: dsc.impostazioni-dsc-m-usa
  centralina: DSC
  titolo:
    it: 'DSC: impostazioni MDM delle M USA'
    en: 'DSC: US M Dynamic Mode settings'
  descrizione:
    it: 'Porta il controllo di stabilità (modalità MDM) alle impostazioni europee sulle M3/M4 F80/F82 americane.'
    en: 'Switches stability control (MDM mode) to the European settings on US-spec M3/M4 F80/F82.'
  parametri:
  - nome: C_AMR_2_c
    regolabile: true
  - nome: C_AMR_3_c
    regolabile: true
  valori_suggeriti:
    it: 00 nella fonte F80
    en: 00 in the F80 source
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  - F80
  note:
    it: 'La fonte riguarda solo le M3/M4 F80/F82 di specifica USA. Su altre auto cambia il comportamento del controllo di stabilità senza un motivo documentato: sconsigliata.'
    en: 'The source only covers US-spec M3/M4 F80/F82. On other cars it changes stability control behaviour for no documented reason: not recommended.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_AMR_2_c=1, C_AMR_3_c=0
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: C_AMR_2_c=1, C_AMR_3_c=0
    esito: Parametro presente, non provato
- id: dsc.dynamic-brake-control
  centralina: DSC
  titolo:
    it: Dynamic Brake Control
    en: Dynamic Brake Control
  descrizione:
    it: 'Attiva il Dynamic Brake Control, l''aiuto del DSC nelle frenate di emergenza.'
    en: 'Enables Dynamic Brake Control, the DSC assistance in emergency braking.'
  parametri:
  - nome: C_Funktion_DynamicBrakeControl_aktiv_I
    target: '01'
  rischio: alto
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'L''unica fonte (F55/F56/F57/F45) dice di attivarla insieme al cambio (EGS). Non descrive cosa cambia alla guida. Riguarda la frenata: prova con prudenza.'
    en: 'The only source (F55/F56/F57/F45) says to enable it together with the gearbox (EGS). It does not describe what changes while driving. Affects braking: test with care.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_Funktion_DynamicBrakeControl_aktiv_I=02
    esito: Da verificare
- id: dsc.sport-personalizzabile
  centralina: DSC
  titolo:
    it: 'Modalità Sport personalizzabile'
    en: 'Customisable Sport mode'
  descrizione:
    it: 'In iDrive compare la configurazione della modalità Sport, per scegliere come si comporta l''auto in Sport.'
    en: 'The iDrive shows the Sport mode setup, to choose how the car behaves in Sport.'
  parametri:
  - nome: QdmKfvSportIndividualisierbarDep
    target: Individualisierbar
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Documentata su una F54 con centralina DSC2, insieme a MACRO_FDS = popup_and_config nella HU. Sulle BMW con ICM l''equivalente è ICMKOD_B_SPORTINDIVIDUALISIERBAR. Sulla JCW F56 letta risulta già attiva.'
    en: 'Documented on an F54 with a DSC2 unit, together with MACRO_FDS = popup_and_config in the HU. On BMWs with ICM the equivalent is ICMKOD_B_SPORTINDIVIDUALISIERBAR. On the JCW F56 read it is already on.'
  fonti:
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5673906/note.aspx
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Transmission/Sport-Mode.md
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=140
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: QdmKfvSportIndividualisierbarDep=NichtIndividualisierbar
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: Individualisierbar
    esito: Già attivo
