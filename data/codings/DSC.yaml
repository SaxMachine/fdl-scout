# Codifiche note per la centralina DSC (MINI F5x)
# Schema: docs/SCHEMA.md

- id: dsc.limitatore-di-velocita-gamma-regolabile
  centralina: DSC
  titolo:
    it: 'Limitatore di velocità: gamma regolabile'
  parametri:
  - nome: C_SLD_vmin_kmh
    regolabile: true
  - nome: C_SLD_vmax_kmh
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Fonte mini-f56-forum.de.
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 30 / 250
    esito: Da verificare
- id: dsc.acc-velocita-massima-e-minima
  centralina: DSC
  titolo:
    it: 'ACC: velocità massima e minima impostabili'
  parametri:
  - nome: C_Wunschgeschw_ACC_max_kmh
    regolabile: true
  - nome: C_Wunschgeschw_min_kmh
    regolabile: true
  valori_suggeriti:
    it: Velocità in km/h dalla lista E-Sys.
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Sulle F5x con ACC a telecamera questi limiti stanno nel DSC, non in una centralina SAS separata. Nella F54
      di riferimento il massimo ACC è initwert (non impostato) e il minimo 30 km/h. La ripartenza automatica (C_Funktion_AccStopAndGo_aktiv_I)
      risulta già attiva.
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: initwert / 30
    esito: Da verificare
  requisiti_sa:
  - '541'
- id: dsc.limitatore-di-velocita
  centralina: DSC
  titolo:
    it: Limitatore di velocità (LIM)
  parametri:
  - nome: C_SLD_Funktion
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Il quadro ha già SLD_ENABLE aktiv e il DSC ha C_SpeedLimitDevice_I aktiv, ma la funzione C_SLD_Funktion
      è spenta. Su Bimmerfest la combinazione KOMBI SLD_ENABLE + DSC C_SLD_Funktion attiva il limitatore con il
      tasto del cruise control. La gamma regolabile è nella voce ''Limitatore di velocità: gamma regolabile''.'
  fonti:
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
