# Codifiche note per la centralina DSC (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: dsc.limitatore-di-velocita-gamma-regolabile
  centralina: DSC
  titolo:
    it: 'Limitatore di velocità: gamma regolabile'
    en: 'Speed limiter: adjustable range'
  parametri:
  - nome: C_SLD_vmin_kmh
    regolabile: true
  - nome: C_SLD_vmax_kmh
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Fonte mini-f56-forum.de.'
    en: 'Source: mini-f56-forum.de.'
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: 30 / 250
    esito: Da verificare
- id: dsc.acc-velocita-massima-e-minima
  centralina: DSC
  titolo:
    it: 'ACC: velocità massima e minima impostabili'
    en: 'ACC: maximum and minimum set speed'
  parametri:
  - nome: C_Wunschgeschw_ACC_max_kmh
    regolabile: true
  - nome: C_Wunschgeschw_min_kmh
    regolabile: true
  valori_suggeriti:
    it: Velocità in km/h dalla lista E-Sys.
    en: Speed in km/h from the E-Sys list.
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Sulla F54 di riferimento questi limiti esistono sia nel DSC (C_Wunschgeschw_*: massimo ACC initwert, minimo 30 km/h) sia nella SAS (LDM_Wunschgeschw_*: massimo 140, minimo 30; vedi la voce SAS). Non è documentato quale dei due valga sulla F54: le fonti BMW li danno nel DSC, il forum tedesco nell''ICM di una F55 senza SAS. Nel DSC risulta attiva anche C_Funktion_AccStopAndGo_aktiv_I.'
    en: 'On the reference F54 these limits exist both in the DSC (C_Wunschgeschw_*: ACC maximum initwert, minimum 30 km/h) and in the SAS (LDM_Wunschgeschw_*: maximum 140, minimum 30; see the SAS entry). Which one applies on the F54 is not documented: BMW sources put them in the DSC, the German forum in the ICM of an F55 without SAS. C_Funktion_AccStopAndGo_aktiv_I is also active in the DSC.'
  fonti:
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/?pageNo=286
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_Wunschgeschw_ACC_max_kmh=initwert, C_Wunschgeschw_min_kmh=30
    esito: Da verificare
  requisiti_sa:
  - '541'
- id: dsc.limitatore-di-velocita
  centralina: DSC
  titolo:
    it: Limitatore di velocità (LIM)
    en: Speed limiter (LIM)
  parametri:
  - nome: C_SLD_Funktion
    target: aktiv
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Il quadro ha già SLD_ENABLE aktiv e il DSC ha C_SpeedLimitDevice_I aktiv, ma la funzione C_SLD_Funktion è spenta. Su Bimmerfest la combinazione KOMBI SLD_ENABLE + DSC C_SLD_Funktion attiva il limitatore con il tasto del cruise control. La gamma regolabile è nella voce ''Limitatore di velocità: gamma regolabile''. Una guida dice che servono tutti e quattro i parametri del limitatore LIM: SLD_ENABLE nel KOMBI, SLD_Funktion, C_Umschaltung_ACC_DCC = zugelassen e LDM_SET_Taste. Sulla F54 di riferimento C_Umschaltung_ACC_DCC è già zugelassen e LDM_SET_Taste non esiste.'
    en: 'The cluster already has SLD_ENABLE aktiv and the DSC has C_SpeedLimitDevice_I aktiv, but the C_SLD_Funktion function is off. On Bimmerfest, KOMBI SLD_ENABLE together with DSC C_SLD_Funktion enables the limiter on the cruise control button. The adjustable range is in the entry ''Speed limiter: adjustable range''. One guide says all four LIM speed limiter parameters are required: SLD_ENABLE in the KOMBI, SLD_Funktion, C_Umschaltung_ACC_DCC = zugelassen and LDM_SET_Taste. On the reference F54 C_Umschaltung_ACC_DCC is already zugelassen and LDM_SET_Taste does not exist.'
  insieme_a:
  - kombi.limitatore-nel-quadro
  fonti:
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Instrument-Cluster.md
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: dsc.impostazioni-dsc-m-usa
  centralina: DSC
  titolo:
    it: 'DSC: impostazioni MDM delle M USA'
    en: 'DSC: US M Dynamic Mode settings'
  parametri:
  - nome: C_AMR_2_c
    regolabile: true
  - nome: C_AMR_3_c
    regolabile: true
  valori_suggeriti:
    it: 00 nella fonte F80
    en: 00 in the F80 source
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F54
  - F80
  note:
    it: 'Impostazioni del controllo di stabilità per M3/M4 F80/F82 USA. Su altre auto: sconsigliata. Parametro presente
      nei FWL della F54 di riferimento; la codifica è documentata nei cheat sheet su GitHub.'
    en: 'Stability control settings for US M3/M4 F80/F82. On other cars: not recommended. Parameter present in the
      reference F54 FWL files; the coding is documented in GitHub cheat sheets.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_AMR_2_c=1, C_AMR_3_c=0
    esito: Da verificare
- id: dsc.dynamic-brake-control
  centralina: DSC
  titolo:
    it: Dynamic Brake Control
    en: Dynamic Brake Control
  parametri:
  - nome: C_Funktion_DynamicBrakeControl_aktiv_I
    target: '01'
  rischio: alto
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Fonte F55/F56/F57/F45: va attivata insieme al cambio (EGS). Riguarda la frenata: prova con prudenza. Parametro
      presente nei FWL della F54 di riferimento; la codifica è documentata nei cheat sheet su GitHub.'
    en: 'F55/F56/F57/F45 source: enable it together with the gearbox (EGS). Affects braking: test carefully. Parameter
      present in the reference F54 FWL files; the coding is documented in GitHub cheat sheets.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: C_Funktion_DynamicBrakeControl_aktiv_I=02
    esito: Da verificare
- id: dsc.sport-personalizzabile
  centralina: DSC
  titolo:
    it: 'Modalità Sport personalizzabile'
    en: 'Customisable Sport mode'
  parametri:
  - nome: QdmKfvSportIndividualisierbarDep
    target: Individualisierbar
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  note:
    it: 'Documentata su una F54 (centralina DSC2): con MACRO_FDS = popup_and_config nella HU compare la configurazione della modalità Sport in iDrive. Sulle BMW con ICM l''equivalente è ICMKOD_B_SPORTINDIVIDUALISIERBAR.'
    en: 'Documented on an F54 (DSC2 unit): with MACRO_FDS = popup_and_config in the HU the Sport mode configuration appears in iDrive. On BMWs with an ICM the equivalent is ICMKOD_B_SPORTINDIVIDUALISIERBAR.'
  insieme_a:
  - hu_nbt2.display-sportivi
  - hu_nbt2.colori-m-display-sportivi
  fonti:
  - https://minkara.carview.co.jp/userid/1338285/car/2786797/5673906/note.aspx
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Transmission/Sport-Mode.md
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=140
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: QdmKfvSportIndividualisierbarDep=NichtIndividualisierbar
    esito: Da verificare
