# Codifiche note per la centralina SMFA (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: smfa.entrata-facilitata
  centralina: SMFA
  titolo:
    it: 'Entrata facilitata: il sedile arretra all''apertura della porta'
    en: 'Easy entry: the seat moves back when the door opens'
  descrizione:
    it: 'Il sedile del guidatore arretra quando apri la porta e torna in posizione all''avvio, per salire e scendere più comodamente.'
    en: 'The driver''s seat moves back when you open the door and returns when you start, for easier getting in and out.'
  parametri:
  - nome: EA_Hilfe
    target: aktiv
  requisiti_sa:
  - '459'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Serve il sedile elettrico (centralina SMFA). L''unica fonte è un cheat sheet coreano, che la indica come "in prova" (01 guidatore, 02 passeggero). Controlla che dietro il sedile non ci siano oggetti o bambini.'
    en: 'Needs the electric seat (SMFA unit). The only source is a Korean cheat sheet, which marks it as "testing" (01 driver, 02 passenger). Make sure there are no objects or children behind the seat.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht_aktiv
    esito: Da verificare
- id: smfa.memoria-riscaldamento-sedile
  centralina: SMFA
  titolo:
    it: Memoria del riscaldamento sedile (centralina sedile)
    en: Seat heating memory (seat module)
  descrizione:
    it: 'Cambia per quanto tempo dopo lo spegnimento il riscaldamento del sedile viene ricordato; di fabbrica 15 minuti.'
    en: 'Changes how long after switching off the seat heating setting is remembered; factory value 15 minutes.'
  parametri:
  - nome: Nachlauf_Schalter
    regolabile: true
  - nome: SA_Nachlaufzeit
    regolabile: true
  valori_suggeriti:
    it: Wert_15 = 15 minuti; scegli un tempo più lungo dalla lista E-Sys.
    en: Wert_15 = 15 minutes; pick a longer time from the E-Sys list.
  requisiti_sa:
  - '494'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Sulle auto con sedile elettrico il tempo può stare nella centralina del sedile oltre che nel BDC (NACHLAUFZEIT_SITZHEIZUNG_FRONT): se cambiarlo nel BDC non basta, prova qui. Nessuna fonte pubblica descrive il parametro: l''abbinamento viene dal nome nel FWL e dall''elenco di BimmerCode.'
    en: 'On cars with an electric seat the time may be in the seat unit as well as in the BDC (NACHLAUFZEIT_SITZHEIZUNG_FRONT): if changing it in the BDC is not enough, try here. No public source describes the parameter: the match comes from the name in the FWL and the BimmerCode list.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: Wert_15 / Wert_15
    esito: Da verificare
