# Codifiche note per la centralina FZD (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: fzd.volume-e-durata-del-segnale-di-chiusura
  centralina: FZD
  titolo:
    it: Volume e durata del segnale acustico dell'allarme
    en: Volume and duration of the alarm chirp
  parametri:
  - nome: Buzzer level high
    regolabile: true
  - nome: Buzzer level low
    regolabile: true
  - nome: Buzzer duration
    regolabile: true
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Nella F54 di riferimento la conferma acustica è gestita dalla sirena dell'allarme nella FZD (CAFD 00001412).
      Il clacson alla chiusura è invece VAM_HORN_AT_SECURE nel BDC.
    en: On the reference F54 the audible confirmation comes from the alarm siren in the FZD (CAFD 00001412). The
      horn when locking is VAM_HORN_AT_SECURE in the BDC instead.
  fonti: &id001
  - https://bimmercode.app/vehicles/f56
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: level_3 / level_2 / 0A
    esito: Da verificare
  valori_suggeriti:
    it: Livelli level_1…level_3; durata in esadecimale. Prova un valore alla volta.
    en: Levels level_1…level_3; duration in hexadecimal. Try one value at a time.
  requisiti_sa:
  - '302'
- id: fzd.conferma-acustica-inserimento-allarme
  centralina: FZD
  titolo:
    it: Conferma acustica all'inserimento e al disinserimento dell'allarme
    en: Audible confirmation when arming and disarming the alarm
  parametri:
  - nome: Akustische Quittierung Schaerfen
    target: aktiv
  - nome: Akustische Quittierung Entschaerfen
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: La sirena emette un breve segnale quando chiudi (Schaerfen) e quando apri (Entschaerfen). Puoi attivare
      anche solo uno dei due.
    en: The siren gives a short chirp when you lock (Schaerfen) and when you unlock (Entschaerfen). You can enable
      just one of the two.
  fonti: *id001
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht aktiv / nicht aktiv
    esito: Da verificare
  requisiti_sa:
  - '302'
- id: fzd.allarme-suono-sensori-volumetrici-protezione-presa-obd
  centralina: FZD
  titolo:
    it: 'Allarme: protezione abitacolo, sensore di inclinazione e presa OBD'
    en: 'Alarm: interior protection, tilt sensor and OBD port'
  parametri:
  - nome: Innenraumschutz
    regolabile: true
  - nome: Neigungssensor
    regolabile: true
  - nome: OBD-Alarm
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Disattivare la protezione abitacolo (Innenraumschutz) è utile se lasci animali in auto; il sensore di inclinazione
      (Neigungssensor) può dare falsi allarmi su traghetti o carroattrezzi. OBD-Alarm fa scattare l'allarme se si
      collega qualcosa alla presa OBD.
    en: Disabling interior protection (Innenraumschutz) helps if you leave pets in the car; the tilt sensor (Neigungssensor)
      can give false alarms on ferries or tow trucks. OBD-Alarm triggers the alarm if something is plugged into
      the OBD port.
  fonti: *id001
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv / aktiv / aktiv
    esito: Da verificare
  valori_suggeriti:
    it: aktiv / nicht aktiv per ciascuno.
    en: aktiv / nicht aktiv for each.
  requisiti_sa:
  - '302'
