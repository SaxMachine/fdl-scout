# Codifiche note per la centralina FZD (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: fzd.volume-e-durata-del-segnale-di-chiusura
  centralina: FZD
  titolo:
    it: Volume e durata del segnale acustico dell'allarme
    en: Volume and duration of the alarm chirp
  descrizione:
    it: 'Cambia volume e durata del segnale acustico della sirena d''allarme, quello che conferma l''inserimento.'
    en: 'Changes volume and length of the alarm siren''s beep, the one that confirms arming.'
  parametri:
  - nome: Buzzer level high
    regolabile: true
  - nome: Buzzer level low
    regolabile: true
  - nome: Buzzer duration
    regolabile: true
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Solo con allarme (FZD). Nessuna fonte pubblica descrive questi parametri: l''abbinamento viene dal nome nel FWL. Il clacson che suona se chiudi l''auto col motore acceso è un''altra cosa (VAM_HORN_AT_SECURE nel BDC). Prova un valore alla volta.'
    en: 'Only with an alarm (FZD). No public source describes these parameters: the match comes from the name in the FWL. The horn that sounds when you lock with the engine running is something else (VAM_HORN_AT_SECURE in the BDC). Try one value at a time.'
  fonti: &id001
  - https://bimmercode.app/vehicles/f56
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: level_3 / level_2 / 0A
    esito: Da verificare
  valori_suggeriti:
    it: Livelli level_1…level_3; durata in esadecimale. Prova un valore alla volta.
    en: Levels level_1…level_3; duration in hexadecimal. Try one value at a time.
  requisiti_sa:
  - '302'
- id: fzd.conferma-acustica-inserimento-allarme
  centralina: FZD
  titolo:
    it: Conferma acustica all'inserimento e al disinserimento dell'allarme
    en: Audible confirmation when arming and disarming the alarm
  descrizione:
    it: 'La sirena dell''allarme fa un breve suono quando chiudi l''auto (Schaerfen) e quando la apri (Entschaerfen).'
    en: 'The alarm siren gives a short beep when you lock the car (Schaerfen) and when you unlock it (Entschaerfen).'
  parametri:
  - nome: Akustische Quittierung Schaerfen
    target: aktiv
  - nome: Akustische Quittierung Entschaerfen
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  note:
    it: 'Solo con allarme (FZD). Puoi attivare anche uno solo dei due parametri.'
    en: 'Only with an alarm (FZD). You can enable just one of the two parameters.'
  fonti: *id001
  fonti:
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=92
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=93
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht aktiv / nicht aktiv
    esito: Da verificare
  requisiti_sa:
  - '302'
- id: fzd.allarme-suono-sensori-volumetrici-protezione-presa-obd
  centralina: FZD
  titolo:
    it: 'Allarme: protezione abitacolo, sensore di inclinazione e presa OBD'
    en: 'Alarm: interior protection, tilt sensor and OBD port'
  descrizione:
    it: 'Accende o spegne tre sensori dell''allarme - protezione abitacolo, sensore di inclinazione e allarme sulla presa OBD.'
    en: 'Turns three alarm sensors on or off - interior protection, tilt sensor and OBD socket alarm.'
  parametri:
  - nome: Innenraumschutz
    regolabile: true
  - nome: Neigungssensor
    regolabile: true
  - nome: OBD-Alarm
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Solo con allarme (FZD). Spegnere la protezione abitacolo serve se lasci animali in auto; il sensore di inclinazione può dare falsi allarmi su traghetti o carroattrezzi; OBD-Alarm fa scattare l''allarme se si collega qualcosa alla presa OBD. Nessuna fonte pubblica descrive questi parametri: l''abbinamento viene dal nome nel FWL.'
    en: 'Only with an alarm (FZD). Turning off interior protection helps if you leave pets in the car; the tilt sensor can cause false alarms on ferries or tow trucks; OBD-Alarm triggers the alarm when something is plugged into the OBD socket. No public source describes these parameters: the match comes from the name in the FWL.'
  fonti: *id001
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv / aktiv / aktiv
    esito: Da verificare
  valori_suggeriti:
    it: aktiv / nicht aktiv per ciascuno.
    en: aktiv / nicht aktiv for each.
  requisiti_sa:
  - '302'
- id: fzd.tipo-di-sirena
  centralina: FZD
  titolo:
    it: 'Tipo di suono della sirena d''allarme'
    en: 'Alarm siren sound type'
  descrizione:
    it: 'Cambia il suono della sirena d''allarme; sulla F10 le scelte sono europeo, americano o britannico (come l''europeo ma più lungo).'
    en: 'Changes the alarm siren sound; on the F10 the choices are European, American or British (like European but longer).'
  parametri:
  - nome: Alarm type
    regolabile: true
  valori_suggeriti:
    it: 'Sulla F10 i valori sono ECE (suono europeo), US (sirena americana) e GB (come ECE ma più lungo).'
    en: 'On the F10 the values are ECE (European sound), US (American siren) and GB (like ECE but longer).'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F10
  - F11
  - F54
  note:
    it: 'Documentata sulla FZD della F10 (gruppo 3002 DWA). Su una MINI il valore letto è 08 senza nome: controlla in E-Sys quali opzioni offre la tua FZD. Il suono dell''allarme deve restare conforme alle norme del tuo paese.'
    en: 'Documented on the F10 FZD (group 3002 DWA). On a MINI the value read is 08 with no name: check in E-Sys which options your FZD offers. The alarm sound must stay compliant with your country''s rules.'
  fonti:
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=142
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: Alarm type=initwert
    esito: Da verificare
