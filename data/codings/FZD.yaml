# Codifiche note per la centralina FZD (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: fzd.volume-e-durata-del-segnale-di-chiusura
  centralina: FZD
  titolo:
    it: Volume e durata del segnale acustico dell'allarme
    en: Volume and duration of the alarm chirp
  parametri:
  - nome: Buzzer level high
    regolabile: true
  - nome: Buzzer level low
    regolabile: true
  - nome: Buzzer duration
    regolabile: true
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Nella F54 di riferimento la conferma acustica è gestita dalla sirena dell''allarme nella FZD (CAFD 00001412). Il clacson alla chiusura è invece VAM_HORN_AT_SECURE nel BDC. Nessuna fonte trovata riporta il nome del parametro: l''abbinamento con la funzione viene dal nome presente nel FWL della F54 e dalla descrizione dell''elenco BimmerCode.'
    en: 'On the reference F54 the audible confirmation comes from the alarm siren in the FZD (CAFD 00001412). The horn when locking is VAM_HORN_AT_SECURE in the BDC instead. No source found gives the parameter name: the match with the function comes from the name in the F54 FWL and the BimmerCode list description.'
  fonti: &id001
  - https://bimmercode.app/vehicles/f56
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: level_3 / level_2 / 0A
    esito: Da verificare
  valori_suggeriti:
    it: Livelli level_1…level_3; durata in esadecimale. Prova un valore alla volta.
    en: Levels level_1…level_3; duration in hexadecimal. Try one value at a time.
  requisiti_sa:
  - '302'
- id: fzd.conferma-acustica-inserimento-allarme
  centralina: FZD
  titolo:
    it: Conferma acustica all'inserimento e al disinserimento dell'allarme
    en: Audible confirmation when arming and disarming the alarm
  parametri:
  - nome: Akustische Quittierung Schaerfen
    target: aktiv
  - nome: Akustische Quittierung Entschaerfen
    target: aktiv
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  note:
    it: La sirena emette un breve segnale quando chiudi (Schaerfen) e quando apri (Entschaerfen). Puoi attivare
      anche solo uno dei due.
    en: The siren gives a short chirp when you lock (Schaerfen) and when you unlock (Entschaerfen). You can enable
      just one of the two.
  fonti: *id001
  fonti:
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=92
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=93
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: nicht aktiv / nicht aktiv
    esito: Da verificare
  requisiti_sa:
  - '302'
- id: fzd.allarme-suono-sensori-volumetrici-protezione-presa-obd
  centralina: FZD
  titolo:
    it: 'Allarme: protezione abitacolo, sensore di inclinazione e presa OBD'
    en: 'Alarm: interior protection, tilt sensor and OBD port'
  parametri:
  - nome: Innenraumschutz
    regolabile: true
  - nome: Neigungssensor
    regolabile: true
  - nome: OBD-Alarm
    regolabile: true
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Disattivare la protezione abitacolo (Innenraumschutz) è utile se lasci animali in auto; il sensore di inclinazione (Neigungssensor) può dare falsi allarmi su traghetti o carroattrezzi. OBD-Alarm fa scattare l''allarme se si collega qualcosa alla presa OBD. Nessuna fonte trovata riporta il nome del parametro: l''abbinamento con la funzione viene dal nome presente nel FWL della F54 e dalla descrizione dell''elenco BimmerCode.'
    en: 'Disabling interior protection (Innenraumschutz) helps if you leave pets in the car; the tilt sensor (Neigungssensor) can give false alarms on ferries or tow trucks. OBD-Alarm triggers the alarm if something is plugged into the OBD port. No source found gives the parameter name: the match with the function comes from the name in the F54 FWL and the BimmerCode list description.'
  fonti: *id001
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: aktiv / aktiv / aktiv
    esito: Da verificare
  valori_suggeriti:
    it: aktiv / nicht aktiv per ciascuno.
    en: aktiv / nicht aktiv for each.
  requisiti_sa:
  - '302'
- id: fzd.tipo-di-sirena
  centralina: FZD
  titolo:
    it: 'Tipo di suono della sirena d''allarme'
    en: 'Alarm siren sound type'
  parametri:
  - nome: Alarm type
    regolabile: true
  valori_suggeriti:
    it: 'Sulla F10 i valori sono ECE (suono europeo), US (sirena americana) e GB (come ECE ma più lungo).'
    en: 'On the F10 the values are ECE (European sound), US (American siren) and GB (like ECE but longer).'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F10
  - F11
  - F54
  note:
    it: 'Documentata sulla FZD della F10 (gruppo 3002 DWA). Sulla F54 di riferimento il valore attuale è 08 e non ha un nome: controlla in E-Sys quali opzioni offre la tua FZD. Il suono dell''allarme deve restare conforme alle norme del tuo paese.'
    en: 'Documented on the F10 FZD (group 3002 DWA). On the reference F54 the current value is 08 with no name: check in E-Sys which options your FZD offers. The alarm sound must stay compliant with your country''s rules.'
  fonti:
  - https://www.bmw-syndikat.de/bmwsyndikatforum/bmw_codieren_datenbank.asp?goto=142
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: Alarm type=initwert (08)
    esito: Da verificare
