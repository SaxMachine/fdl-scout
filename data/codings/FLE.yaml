# Codifiche note per la centralina FLE (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: fle.abbaglianti-antiabbagliamento-fari
  centralina: FLE
  titolo:
    it: 'Abbaglianti antiabbagliamento: tabelle dei fari'
    en: 'Glare-free high beam: headlight tables'
  descrizione:
    it: 'Abilita nei moduli dei fari gli abbaglianti antiabbagliamento, che oscurano la parte di fascio diretta verso le altre auto.'
    en: 'Enables glare-free high beams in the headlight modules, which dim the part of the beam aimed at other cars.'
  parametri:
  - nome: Blendfreies_Fernlicht_Idx
    regolabile: true
  valori_suggeriti:
    it: Tabelle complete nelle fonti, specifiche per i fari di F80/F82 e F15
    en: Full tables in the sources, specific to F80/F82 and F15 headlights
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F15
  - F54
  - F56
  - F80
  - F82
  note:
    it: 'Le fonti cambiano più di 120 parametri dei moduli fari, con tabelle specifiche per i fari LED di F80/F82 e F15, insieme a FEM/BDC e alla telecamera (KAFAS). Su fari diversi rischi malfunzionamenti e luci non omologate: sconsigliata.'
    en: 'Sources change more than 120 headlight module parameters, with tables specific to the F80/F82 and F15 LED headlights, together with FEM/BDC and the camera (KAFAS). On other headlights you risk faults and non-compliant lights: not recommended.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Kip_M3.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/pmooiweer.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: Blendfreies_Fernlicht_Idx=00010200000002000000
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: 30_Value
    esito: Parametro presente, non provato
