- id: ihka.ricircolo-non-automatico
  centralina: IHKA
  titolo:
    it: Ricircolo non riattivato automaticamente
    en: Recirculation not restarted automatically
  descrizione:
    it: 'Il clima non riattiva più da solo il ricircolo dell''aria.'
    en: 'The climate control no longer switches air recirculation back on by itself.'
  parametri:
  - nome: UMLUFT_AUTO_AUS
    regolabile: true
  valori_suggeriti:
    it: nicht_aktiv / disable
    en: nicht_aktiv / disable
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F01
  - F07
  - F10
  - F15
  - F16
  - F20
  - F25
  - F26
  - F30
  - F54
  - F56
  note:
    it: 'Le fonti usano nicht_aktiv (BMW) o disable (cheat sheet coreano).'
    en: 'Sources use nicht_aktiv (BMW) or disable (Korean cheat sheet).'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: UMLUFT_AUTO_AUS=AKTIV
    esito: Da verificare
