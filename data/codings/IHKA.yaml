# Codifiche note per la centralina IHKA (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: ihka.memoria-del-ricircolo
  centralina: IHKA
  titolo:
    it: Memoria del ricircolo
    en: Recirculation memory
  descrizione:
    it: 'Quando riaccendi l''auto il ricircolo dell''aria resta come l''avevi lasciato.'
    en: 'When you restart the car, air recirculation stays as you left it.'
  parametri:
  - nome: MEMORY_UMLUFT
    target: AKTIV
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'Una fonte francese precisa che di fabbrica lo stato viene ricordato solo per 15 minuti dallo spegnimento.'
    en: 'A French source notes that from the factory the state is only remembered for 15 minutes after switching off.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-6.html
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: NICHT_AKTIV
    esito: Consigliato
- id: ihka.calore-residuo-a-motore-spento
  centralina: IHKA
  titolo:
    it: Calore residuo a motore spento
    en: Residual heat with the engine off
  descrizione:
    it: 'Nessuna fonte descrive questo parametro. Dal nome (Restwärme, calore residuo) è la funzione che scalda l''abitacolo con il calore del motore spento.'
    en: 'No source describes this parameter. From its name (Restwärme, residual heat) it is the function that heats the cabin with the heat of the switched-off engine.'
  parametri:
  - nome: RESTWAERME
    regolabile: true
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Sulle auto lette manca la pompa dell''acqua elettrica supplementare, che questa funzione di solito richiede: probabilmente non funziona. L''abbinamento viene solo dal nome nel FWL.'
    en: 'The cars read lack the additional electric water pump this function usually needs: it probably does not work. The match comes only from the name in the FWL.'
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: NICHT_AKTIV
    esito: Non possibile
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: NICHT_AKTIV
    esito: Parametro presente, non provato
- id: ihka.memoria-del-clima-spento
  centralina: IHKA
  titolo:
    it: Memoria del clima spento
    en: Climate off memory
  descrizione:
    it: 'Se spegni l''auto con l''aria condizionata spenta, alla ripartenza resta spenta.'
    en: 'If you switch the car off with the A/C off, it stays off when you set off again.'
  parametri:
  - nome: MEMORY_OFF
    target: AKTIV
  rischio: basso
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-6.html
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://ncs-expert.com/wp-content/uploads/Coding-Parameters-F22.pdf
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: AKTIV
    esito: Già attivo
- id: ihka.cambio-colore-del-display-clima
  centralina: IHKA
  titolo:
    it: Cambio colore del display clima
    en: Climate display colour change
  descrizione:
    it: 'Il display del clima cambia colore, rosso o blu, quando alzi o abbassi la temperatura.'
    en: 'The climate display changes colour, red or blue, when you raise or lower the temperature.'
  parametri:
  - nome: Display-Farbumschlag
    target: AKTIV
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Nessuna fonte pubblica descrive il parametro: la descrizione viene dall''elenco di BimmerCode e il nome dal FWL.'
    en: 'No public source describes the parameter: the description comes from the BimmerCode list and the name from the FWL.'
  fonti:
  - https://bimmercode.app/vehicles/f56
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: INAKTIV
    esito: Da verificare
- id: ihka.aria-condizionata-spenta-in-auto
