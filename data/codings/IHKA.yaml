- id: ihka.cambio-colore-del-display-clima
  centralina: IHKA
  titolo:
    it: Cambio colore del display clima
    en: Climate display colour change
  parametri:
  - nome: Display-Farbumschlag
    target: AKTIV
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Elenco BimmerCode. Il display del clima cambia colore (rosso/blu) quando alzi o abbassi la temperatura.
    en: BimmerCode list. The climate display changes colour (red/blue) when you raise or lower the temperature.
  fonti:
  - https://bimmercode.app/vehicles/f56
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: INAKTIV
    esito: Da verificare
