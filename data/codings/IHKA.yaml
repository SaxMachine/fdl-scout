    it: A/C non attivata dal tasto AUTO
    en: A/C not switched on by AUTO
  descrizione:
    it: 'Premendo AUTO sul clima l''aria condizionata non si accende più da sola; la accendi tu col tasto A/C.'
    en: 'Pressing AUTO on the climate control no longer switches the A/C on by itself; you turn it on with the A/C button.'
  parametri:
  - nome: AC_ON_WITH_AUTO
    target: nicht_aktiv
  rischio: basso
