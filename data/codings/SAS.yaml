# Codifiche note per la centralina SAS (MINI F5x)
# Schema: docs/SCHEMA.md

- id: sas.acc-stop-and-go
  centralina: SAS
  titolo:
    it: 'ACC Stop & Go: frenata fino all''arresto'
  parametri:
  - nome: LDM_Fahrfunktion
    target: ACC_SnG
  requisiti_sa:
  - '541'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai: &id001
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'Va insieme a C_Funktion_AccStopAndGo_aktiv_I nel DSC (attivo nella F54 di riferimento). Su minif56 un utente
      F57 con cambio DKG riporta che dopo la codifica non è cambiato nulla: esito incerto sulle MINI con ACC a telecamera.'
  fonti:
  - https://www.minif56.com/threads/active-cruise-control-541-activating-stop-and-go.87884/
  - https://www.mini-f56-forum.de/forum/thread/258-codierung-im-mini-f54-f55-f56-rpa-licht-bis-hin-zu-ssa-anwendung-auf-eigene-gefa/
- id: sas.acc-ripartenza-automatica
  centralina: SAS
  titolo:
    it: 'ACC: ripartenza automatica dopo l''arresto'
  parametri:
  - nome: LDM_Automatisches_Losfahren
    regolabile: true
  valori_suggeriti:
    it: automatisches Losfahren
  requisiti_sa:
  - '541'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai: *id001
  note:
    it: Facoltativa, dopo lo Stop & Go. Valore 'automatisches Losfahren' dalla lista E-Sys.
  fonti:
  - https://www.minif56.com/threads/active-cruise-control-541-activating-stop-and-go.87884/
- id: sas.acc-velocita-massima
  centralina: SAS
  titolo:
    it: 'ACC: velocità massima impostabile'
  parametri:
  - nome: LDM_WUNSCHGESCHW_ACC_max_kmh
    regolabile: true
  valori_suggeriti:
    it: Velocità in km/h dalla lista E-Sys, es. 180.
  requisiti_sa:
  - '541'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai: *id001
  note:
    it: 'Su Bimmerfest portata da 140 a 180 km/h. Sulle F5x il valore potrebbe stare anche nel DSC (C_Wunschgeschw_ACC_max_kmh):
      verifica quale dei due usa la tua auto.'
  fonti:
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
- id: sas.assistente-coda
  centralina: SAS
  titolo:
    it: Assistente nel traffico (Traffic Jam Assist)
  parametri:
  - nome: LDM_STA_Einschraenkung
    regolabile: true
  - nome: LDM_Stauassisten_vorhanden
    regolabile: true
  valori_suggeriti:
    it: keine Einschraenkung / true
  requisiti_sa:
  - '541'
  rischio: alto
  consiglio: ok
  affidabilita: da_verificare
  telai: *id001
  note:
    it: 'Documentato su BMW F45/F48 con radar. Su una F56 l''iDrive ha risposto che la funzione non è attivabile:
      probabilmente richiede hardware che le MINI non hanno.'
  fonti:
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
