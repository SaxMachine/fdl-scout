# Codifiche note per la centralina ACSM (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: acsm.preavviso-cinture-guidatore
  centralina: ACSM
  titolo:
    it: Togliere il preavviso acustico cinture del guidatore
    en: Remove the driver seat belt pre-warning chime
  parametri:
  - nome: SBR-Prewarning_Fahrer
    target: nicht_aktiv
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Documentato sullo stesso CAFD della F54 (ACSM 000011AB, F55/F56/F57/F45) come Prewarning_* o SBR_PreWarning_*; nel FWL della F54 il nome è SBR-Prewarning_*. Riguarda la sicurezza: sconsigliata. Vedi anche le voci sull''avviso cinture (SeatBeltReminder_*).'
    en: 'Documented on the same CAFD as the F54 (ACSM 000011AB, F55/F56/F57/F45) as Prewarning_* or SBR_PreWarning_*; in the F54 FWL the name is SBR-Prewarning_*. Safety-related: not recommended. See also the seat belt reminder entries (SeatBeltReminder_*).'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: SBR-Prewarning_Fahrer=nicht_aktiv
    esito: Da verificare
