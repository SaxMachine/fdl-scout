- id: acsm.durata-avviso-cinture
  centralina: ACSM
  titolo:
    it: Durata del cicalino delle cinture
    en: Seat belt chime duration
  descrizione:
    it: 'Cambia per quanto tempo suona l''avviso delle cinture slacciate.'
    en: 'Changes how long the unbuckled seat belt warning sounds.'
  parametri:
  - nome: GWF_SBR_WARNDAUER
    regolabile: true
  valori_suggeriti:
    it: 05 nelle fonti (circa 5 s); 0A = 10 s
    en: 05 in the sources (about 5 s); 0A = 10 s
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F01
  - F02
  - F03
  - F04
  - F06
  - F07
  - F10
  - F11
  - F12
  - F13
  - F15
  - F16
  - F18
  - F20
  - F21
  - F22
  - F23
  - F25
  - F26
  - F30
  - F31
  - F32
  - F33
  - F34
  - F35
  - F36
  - F45
  - F48
  - F54
  - F55
  - F56
  - F57
  - F80
  - F82
  - F83
  - F85
  - F86
  note:
    it: 'Le fonti indicano 5A (90 s) o 100 s come valore di fabbrica e lo portano a 05 (5 s), 0A (10 s) o 00. Riguarda la sicurezza: sconsigliata.'
    en: 'Sources give 5A (90 s) or 100 s as the factory value and change it to 05 (5 s), 0A (10 s) or 00. Safety-related: not recommended.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-6.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: GWF_SBR_WARNDAUER=00
    esito: Da verificare
- id: acsm.avviso-cinture-guidatore
  centralina: ACSM
  titolo:
    it: 'Togliere l''avviso cinture del guidatore'
    en: 'Remove the driver seat belt warning'
  descrizione:
    it: 'Toglie l''avviso (spia e cicalino) che parte quando l''auto si muove con la cintura del guidatore slacciata.'
    en: 'Removes the warning (light and chime) that starts when the car moves with the driver''s seat belt unbuckled.'
  parametri:
  - nome: SeatBeltReminder_Fahrer
    target: '00'
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Il valore 00 per toglierlo è documentato sullo stesso CAFD della ACSM MINI (000011AB, F55/F56/F57/F45). Su una ACSM più recente (G11/G30) i valori sono 00 = assente, 03 = con sensore di occupazione del sedile, 04 = senza sensore; sulle MINI si legge 04, ma la tabella va controllata in E-Sys. Alcune fonti chiamano il parametro SeatBeltReminder_SBR_*. Riguarda la sicurezza: sconsigliata.'
    en: 'The value 00 to remove it is documented on the same CAFD as the MINI ACSM (000011AB, F55/F56/F57/F45). On a newer ACSM (G11/G30) the values are 00 = not fitted, 03 = with seat occupancy sensor, 04 = without sensor; MINIs read 04, but check the table in E-Sys. Some sources call the parameter SeatBeltReminder_SBR_*. Safety-related: not recommended.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/tutuianu_daniel.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/03-Features/Safety-Features.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: SeatBeltReminder_Fahrer=04
    esito: Avviso presente alla partenza (04 = SBR_ohne_SBE)
