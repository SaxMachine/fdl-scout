    anno: 2022
    i_level: F056-26-03-519
    valore_letto: GWF_SBR_WARNDAUER=00
    esito: Da verificare
- id: acsm.avviso-cinture-guidatore
  centralina: ACSM
  titolo:
    it: Togliere l'avviso cinture del guidatore
    en: Remove the driver seat belt reminder
  parametri:
  - nome: SeatBeltReminder_Fahrer
    target: '00'
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'È l''avviso alla partenza (spia e cicalino quando l''auto si muove con la cintura slacciata). Sull''ACSM i valori sono 00 = SBR_nicht_verbaut (assente), 03 = SBR_mit_SBE (con sensore di occupazione del sedile), 04 = SBR_ohne_SBE (senza sensore). La F54 di riferimento legge 04 e l''avviso funziona su guidatore e passeggero. Portarlo a 00 è documentato sullo stesso CAFD della F54 (000011AB, F55/F56/F57/F45). Riguarda la sicurezza: sconsigliata.'
    en: 'This is the warning at departure (light and chime when the car moves with the belt unbuckled). On the ACSM the values are 00 = SBR_nicht_verbaut (not fitted), 03 = SBR_mit_SBE (with seat occupancy sensor), 04 = SBR_ohne_SBE (without sensor). The reference F54 reads 04 and the warning works for driver and passenger. Setting it to 00 is documented on the same CAFD as the F54 (000011AB, F55/F56/F57/F45). Safety-related: not recommended.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/tutuianu_daniel.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/03-Features/Safety-Features.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: SeatBeltReminder_Fahrer=04
    esito: Avviso presente alla partenza (04 = SBR_ohne_SBE)
