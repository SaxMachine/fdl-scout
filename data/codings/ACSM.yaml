    anno: 2022
    i_level: F056-26-03-519
    valore_letto: SBR-Prewarning_Beifahrer=aktiv
    esito: Da verificare
- id: acsm.spia-cinture-guidatore
  centralina: ACSM
  titolo:
    it: Spegnere la spia cinture del guidatore nel quadro
    en: Turn off the driver seat belt light in the cluster
  descrizione:
    it: 'Nel quadro non compare più lo stato della cintura del guidatore.'
    en: 'The cluster no longer shows the driver''s seat belt status.'
  parametri:
  - nome: Gurtzustandsanzeige_Fahrer
    target: nicht_aktiv
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'Documentata con questo nome sull''ACSM di G11/G30 ("firmware 2016") e su F10/F20/F30 come Gurtzustandsanzeige_*_GWF_GZA_*; nessuna fonte la descrive su una MINI. Riguarda la sicurezza: sconsigliata. Vedi anche le voci sull''avviso cinture.'
    en: 'Documented under this name on the G11/G30 ACSM ("2016 firmware") and on F10/F20/F30 as Gurtzustandsanzeige_*_GWF_GZA_*; no source describes it on a MINI. Safety-related: not recommended. See also the seat belt warning entries.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: Gurtzustandsanzeige_Fahrer=aktiv
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: aktiv
    esito: Parametro presente, non provato
