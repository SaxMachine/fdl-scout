    en: 'This is not the warning when you set off: that is the entry "Remove the passenger seat belt warning". Sources for F-series ACSMs describe it as a chime; a Korean cheat sheet speaks of a light instead. Depending on the version the parameter is called SBR-Prewarning_*, Prewarning_* or SBR_PreWarning_*. Safety-related: not recommended.'
