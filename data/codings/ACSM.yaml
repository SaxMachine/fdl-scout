# Codifiche note per la centralina ACSM (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: acsm.preavviso-cinture-guidatore
  centralina: ACSM
  titolo:
    it: Togliere il cicalino quando si slaccia la cintura in marcia (guidatore)
    en: Remove the chime when the seat belt is unbuckled while driving (driver)
  descrizione:
    it: 'Toglie il cicalino che suona quando il guidatore slaccia la cintura con l''auto già in marcia.'
    en: 'Removes the chime that sounds when the driver unbuckles while the car is already moving.'
  parametri:
  - nome: SBR-Prewarning_Fahrer
    target: nicht_aktiv
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Non è l''avviso alla partenza: quello è la voce "Togliere l''avviso cinture del guidatore". Le fonti per le ACSM serie F lo descrivono come cicalino; un cheat sheet coreano parla invece di spia. A seconda della versione il parametro si chiama SBR-Prewarning_*, Prewarning_* o SBR_PreWarning_*. Riguarda la sicurezza: sconsigliata.'
    en: 'This is not the warning when you set off: that is the entry "Remove the driver seat belt warning". Sources for F-series ACSMs describe it as a chime; a Korean cheat sheet speaks of a light instead. Depending on the version the parameter is called SBR-Prewarning_*, Prewarning_* or SBR_PreWarning_*. Safety-related: not recommended.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-4.html
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/03-Features/Safety-Features.md
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://f48.bimmerpost.com/forums/showthread/1222484/bmw-e-sys-coding-for-the-f48-x1/page/11
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: SBR-Prewarning_Fahrer=nicht_aktiv
    esito: Da verificare
