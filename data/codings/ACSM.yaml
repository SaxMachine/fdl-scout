- id: acsm.spia-cinture-guidatore
  centralina: ACSM
  titolo:
    it: Spegnere la spia cinture del guidatore nel quadro
    en: Turn off the driver seat belt light in the cluster
  parametri:
  - nome: Gurtzustandsanzeige_Fahrer
    target: nicht_aktiv
  rischio: alto
  consiglio: sconsigliata
  affidabilita: da_verificare
  telai:
  - F45
  - F54
  - F55
  - F56
  - F57
  note:
    it: 'Spegne la spia delle cinture nel quadro. Documentato sull''ACSM di G11/G30 con questo nome esatto e su F10/F20/F30 come Gurtzustandsanzeige_*_GWF_GZA_*; non ancora sul CAFD MINI. Riguarda la sicurezza: sconsigliata. Vedi anche le voci sull''avviso cinture (SeatBeltReminder_*).'
    en: 'Turns off the seat belt light in the cluster. Documented on the G11/G30 ACSM with this exact name and on F10/F20/F30 as Gurtzustandsanzeige_*_GWF_GZA_*; not yet on the MINI CAFD. Safety-related: not recommended. See also the seat belt reminder entries (SeatBeltReminder_*).'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: Gurtzustandsanzeige_Fahrer=aktiv
    esito: Da verificare
