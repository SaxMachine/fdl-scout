- id: kafas.avviso-corsia-velocita
  centralina: KAFAS
  titolo:
    it: 'Avviso uscita di corsia: velocità minima'
    en: 'Lane departure warning: minimum speed'
  descrizione:
    it: 'Abbassa la velocità da cui l''avviso di uscita di corsia si attiva. Di fabbrica parte a 70 km/h e si spegne sotto i 65.'
    en: 'Lowers the speed from which lane departure warning works. From the factory it starts at 70 km/h and stops below 65.'
  parametri:
  - nome: THRV_AVAI_TLC_HIGH
    regolabile: true
  - nome: THRV_AVAI_TLC_LOW
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale in km/h: 37 = 55, 3C = 60'
    en: 'Hex in km/h: 37 = 55, 3C = 60'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F20
  - F30
  - F54
  - F56
  note:
    it: 'Valori esadecimali in km/h: le fonti usano 37 (55) e 32 (50), oppure 3C (60) e 37 (55).'
    en: 'Hex values in km/h: sources use 37 (55) and 32 (50), or 3C (60) and 37 (55).'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/Dauxdu/bmw-coding/blob/main/e-sys/02-Codings/Driver-Assistance/LDW.md
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: THRV_AVAI_TLC_HIGH=rest_of_the_world, THRV_AVAI_TLC_LOW=rest_of_the_world
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: THRV_AVAI_TLC_HIGH=rest_of_the_world, THRV_AVAI_TLC_LOW=rest_of_the_world
    esito: Parametro presente, non provato
