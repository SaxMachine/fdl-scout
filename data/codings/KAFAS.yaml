    en: 'Needs LED headlights with glare-free high beams and must be coded together with FEM/BDC and the headlight modules (FLE entry). It does not work with standard headlights and you risk non-compliant lights: not recommended.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/pmooiweer.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: GLAREFREE_HIGHBEAM_ENABLED=F020_F025_F045_F056_RR01_M013_off
