- id: kafas.divieto-sorpasso-hud-telecamera
  centralina: KAFAS
  titolo:
    it: Divieto di sorpasso nell'HUD (telecamera)
    en: No-overtaking in the HUD (camera)
  descrizione:
    it: 'È la parte della telecamera che serve a mostrare nell''HUD il divieto di sorpasso.'
    en: 'It is the camera part needed to show no-overtaking signs in the HUD.'
  parametri:
  - nome: NPI_ON_OFF
    regolabile: true
  valori_suggeriti:
    it: 'Sulle BMW F10/F15 la fonte usa 01; su una MINI F56 (NAM) il valore per attivarlo è F056.'
    en: 'On BMW F10/F15 the source uses 01; on a MINI F56 (NAM) the value to enable it is F056.'
  rischio: basso
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F10
  - F15
  - F54
  - F56
  note:
    it: 'Va con HUD_NPI_ENABLE nel KOMBI. Sulle BMW F10/F15 la fonte usa 01; su una MINI F56 (NAM) il valore è F056, che sulle MINI lette c''è già.'
    en: 'Goes with HUD_NPI_ENABLE in the KOMBI. On BMW F10/F15 the source uses 01; on a MINI F56 (NAM) the value is F056, which the MINIs read already have.'
  fonti:
  - https://www.northamericanmotoring.com/forums/f55-f56-hatch-talk-2014/279326-mini-coding-programming-40.html
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
