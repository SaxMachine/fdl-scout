# Codifiche note per la centralina KAFAS (MINI F5x)
# Schema: docs/SCHEMA.md

- id: kafas.distanza-dal-veicolo-che-precede
  centralina: KAFAS
  titolo:
    it: Distanza dal veicolo che precede
  parametri:
  - nome: DISPLAY_HEADWAY_DISTANCE
    regolabile: true
  valori_suggeriti:
    it: valore on (lista E-Sys)
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: Mostra il tempo di distanza. L'ACC su F54 è a telecamera; l'effetto varia.
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: coded_off
    esito: Da verificare
- id: kafas.avviso-uscita-corsia-attivazione
  centralina: KAFAS
  titolo:
    it: 'Avviso uscita di corsia: attivazione nella telecamera'
  parametri:
  - nome: TLC_START_VERSION
    target: '01'
  - nome: DT_LNDT_SEND
    target: messages_activated
  rischio: medio
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  - F57
  - F60
  note:
    it: 'TLC_START_VERSION non ha 01 nella lista E-Sys: va scritto a mano. Procedura completa su F54 (minif56):
      KOMBI TLC_VERBAUT, ST_TLC_*; BDC ComAdapterPdu_18A_Steuerung_Vibration_Lenkrad e SPURVERLASSENS_WARNUNG; KAFAS
      TLC_ON_OFF, SEND_MSG_327/18A; HU LANE_DEPARTURE_WARNING; KAFAS TLC_START_VERSION 01 e DT_LNDT_SEND. Un utente
      F54 l''ha attivata senza montare il motorino di vibrazione: la vibrazione è leggera. Richiede la telecamera
      KAFAS.'
  fonti:
  - https://www.minif56.com/threads/lane-departure-warning-coding-on-f54-clubman.89617/
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: default_off / messages_deactivated
    esito: Confermata su un'altra F54 (minif56)
