    regolabile: true
  - nome: SPEED_SWITCHING_HIGH_BEAMS_ON
    regolabile: true
  - nome: SPEED_SWITCHING_HIGH_BEAMS_OFF
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale in km/h: 28 = 40 (on), 1E = 30 (off); oppure il valore di un mercato dalla lista'
    en: 'Hex in km/h: 28 = 40 (on), 1E = 30 (off); or a market value from the list'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F01
  - F02
