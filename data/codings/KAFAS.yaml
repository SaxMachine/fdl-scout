# Codifiche note per la centralina KAFAS (BMW e MINI serie F: i telai di ogni voce sono in `telai`)
# Schema: docs/SCHEMA.md

- id: kafas.distanza-dal-veicolo-che-precede
  centralina: KAFAS
  titolo:
    it: Distanza dal veicolo che precede
    en: Distance to the vehicle ahead
  descrizione:
    it: 'Nell''HUD compare l''indicazione della distanza dal veicolo davanti.'
    en: 'The HUD shows the distance to the vehicle ahead.'
  parametri:
  - nome: DISPLAY_HEADWAY_DISTANCE
    regolabile: true
  valori_suggeriti:
    it: valore on (lista E-Sys)
    en: on value (E-Sys list)
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F54
  - F56
  note:
    it: 'È la terza parte della funzione insieme alle voci nel KOMBI e nella HU. Le fonti dicono che serve il cruise control attivo (ACC). Sulle MINI l''ACC funziona con la telecamera e l''effetto non è documentato.'
    en: 'It is the third part of the feature together with the KOMBI and HU entries. Sources say active cruise control (ACC) is needed. On MINIs ACC works with the camera and the effect is not documented.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Almaretto.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: coded_off
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: coded_off
    esito: Parametro presente, non provato
- id: kafas.avviso-uscita-corsia-attivazione
  centralina: KAFAS
  titolo:
    it: 'Avviso uscita di corsia: attivazione nella telecamera'
    en: 'Lane departure warning: enable in the camera'
  descrizione:
    it: 'Attiva nella telecamera l''avviso di uscita di corsia, che fa vibrare il volante quando superi le strisce senza freccia.'
    en: 'Enables lane departure warning in the camera, which vibrates the steering wheel when you cross the lines without indicating.'
  parametri:
  - nome: TLC_START_VERSION
    target: '01'
  - nome: DT_LNDT_SEND
    target: messages_activated
  rischio: medio
  consiglio: ok
  affidabilita: confermata
  telai:
  - F54
  - F55
  - F56
  note:
    it: 'È l''ultimo passo di una procedura su più centraline, descritta su una F54 (minif56): KOMBI TLC_VERBAUT e ST_TLC_*; BDC ComAdapterPdu_18A_Steuerung_Vibration_Lenkrad e SPURVERLASSENS_WARNUNG; KAFAS TLC_ON_OFF e SEND_MSG_327/18A; HU LANE_DEPARTURE_WARNING. TLC_START_VERSION non ha 01 nella lista E-Sys: va scritto a mano. Un utente l''ha attivata senza montare il motorino di vibrazione nel volante e la vibrazione è risultata leggera. Serve la telecamera KAFAS.'
    en: 'It is the last step of a procedure across several units, described on an F54 (minif56): KOMBI TLC_VERBAUT and ST_TLC_*; BDC ComAdapterPdu_18A_Steuerung_Vibration_Lenkrad and SPURVERLASSENS_WARNUNG; KAFAS TLC_ON_OFF and SEND_MSG_327/18A; HU LANE_DEPARTURE_WARNING. TLC_START_VERSION has no 01 in the E-Sys list: type it by hand. One user enabled it without fitting the steering wheel vibration motor and found the vibration weak. Needs the KAFAS camera.'
  fonti:
  - https://www.minif56.com/threads/lane-departure-warning-coding-on-f54-clubman.89617/
  - https://www.bimmerfest.com/threads/f45-f46-f48-f55-f56-coding-thread.891935/
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: default_off / messages_deactivated
    esito: Confermata su un'altra F54 (minif56)
- id: kafas.abbaglianti-automatici-soglie-velocita
  centralina: KAFAS
  titolo:
    it: 'Abbaglianti automatici: soglie di velocità'
    en: 'High-beam assistant: speed thresholds'
  descrizione:
    it: 'Cambia a che velocità gli abbaglianti automatici si attivano e si disattivano. Di fabbrica si accendono sopra i 40 km/h e si spengono sotto i 30.'
    en: 'Changes at which speed automatic high beams switch on and off. From the factory they come on above 40 km/h and go off below 30.'
  parametri:
  - nome: FLA_ON_OFF
    regolabile: true
  - nome: SPEED_SWITCHING_HIGH_BEAMS_ON
    regolabile: true
  - nome: SPEED_SWITCHING_HIGH_BEAMS_OFF
    regolabile: true
  valori_suggeriti:
    it: 'Esadecimale in km/h: 28 = 40 (on), 1E = 30 (off); oppure il valore di un mercato dalla lista'
    en: 'Hex in km/h: 28 = 40 (on), 1E = 30 (off); or a market value from the list'
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F01
  - F02
  - F03
  - F04
  - F06
  - F07
  - F10
  - F11
  - F12
  - F13
  - F15
  - F16
  - F18
  - F20
  - F21
  - F22
  - F23
  - F25
  - F26
  - F30
  - F31
  - F32
  - F33
  - F34
  - F35
  - F36
  - F45
  - F48
  - F54
  - F55
  - F56
  - F57
  - F80
  - F82
  - F83
  - F85
  - F86
  note:
    it: 'Una fonte francese li porta a 30 e 25 km/h (1E e 19). FLA_ON_OFF è l''interruttore generale della funzione e di solito è già FLA_on. Sulle MINI lette la soglia di accensione ha l''etichetta US ma il valore è 28, cioè 40 km/h come di fabbrica.'
    en: 'A French source sets them to 30 and 25 km/h (1E and 19). FLA_ON_OFF is the main switch of the feature and is usually already FLA_on. On the MINIs read the switch-on threshold is labelled US but its value is 28, i.e. 40 km/h as from the factory.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Bundang_Thunder.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/ekfxisid.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: FLA_ON_OFF=FLA_on, SPEED_SWITCHING_HIGH_BEAMS_ON=US, SPEED_SWITCHING_HIGH_BEAMS_OFF=all_others
    esito: Da verificare
- id: kafas.abbaglianti-automatici-ritardi
  centralina: KAFAS
  titolo:
    it: 'Abbaglianti automatici: tempi di reazione'
    en: 'High-beam assistant: reaction delays'
  descrizione:
    it: 'Gli abbaglianti automatici si riaccendono prima dopo un''auto incrociata, superata o seguita.'
    en: 'Automatic high beams come back on sooner after an oncoming, overtaken or preceding car.'
  parametri:
  - nome: DELAY_AFTER_ONCOMING
    regolabile: true
  - nome: ONCOMING_HIGH_SPEED_DELAY
    regolabile: true
  - nome: DELAY_AFTER_PRECEDING
    regolabile: true
  - nome: DELAY_AFTER_SLOW_OVERTAKING
    regolabile: true
  valori_suggeriti:
    it: Valori esadecimali nella fonte
    en: Hex values in the source
  rischio: medio
  consiglio: ok
  affidabilita: da_verificare
  telai:
  - F20
  - F30
  - F54
  - F56
  note:
    it: 'Una sola fonte, francese, con valori esadecimali più bassi di quelli di fabbrica. Ritardi troppo brevi possono abbagliare gli altri.'
    en: 'A single French source, with hex values lower than the factory ones. Delays that are too short may dazzle other drivers.'
  fonti:
  - https://github.com/packetpilot/bmw-f/blob/master/cheats/Botho.xml
  osservazioni:
  - telaio: F54
    anno: 2022
    i_level: F056-26-03-519
    valore_letto: DELAY_AFTER_ONCOMING=default, ONCOMING_HIGH_SPEED_DELAY=default, DELAY_AFTER_PRECEDING=default,
      DELAY_AFTER_SLOW_OVERTAKING=default
    esito: Da verificare
  - telaio: F56
    anno: 2023
    i_level: F056-26-03-550
    valore_letto: DELAY_AFTER_ONCOMING=default, ONCOMING_HIGH_SPEED_DELAY=default, DELAY_AFTER_PRECEDING=default, DELAY_AFTER_SLOW_OVERTAKING=default
    esito: Parametro presente, non provato
